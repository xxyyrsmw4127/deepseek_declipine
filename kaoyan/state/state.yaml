  english_policy_1013:
    text: "**用户 2026-10-13 20:1x 决定：『我现在的英语水平太糟糕了，英语应该提升一个档次的重要性，接下来每天都将花不少于 2h 的时间去学习英语』**"
    effective_from: 2026-10-14
    means: "**英语每日下限 45′ → 120′**（P1 → 提升为『与 P0 并列的第二优先』）。**未降低数学 / 408 的 180′ 保底**（红线：放宽/收紧 KPI 须用户明确说；本次是**用户主动上调**，故合法）。"
    cost_accounting: "**新增 75′/天必须找到出处，不许凭空塞**（宪法第 13 条：目标不是每天输出最大化，是机器不宕机）。**推荐出处（用户未表态前不生效）**：① **词汇音频 20-30′ 并入走路块**（`vocab_audio_loop` 主窗口 —— 至今 0 次执行，本就该占这个窗口，**不占桌前时间**）；② 精读块 55′ + 长难句/回炉 20′ 进桌前；③ **深恢复 45-90′ 的走路同时承载词汇音频**（R6 与词汇一笔两用）。按此账：**桌前净学习 8h25m（数学 180 + 408 180 + 英语 75 + 政治 30 = 465′）+ 英语音频 30′ 藏在走路里 = 该口径下 9.5h 目标不变**。"
