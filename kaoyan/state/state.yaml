  gd_notice_1009: "**10/9 广东省公告要点（广东省教育考试院 2026-09-29 发布；用户提供全文，与深圳官网版交叉核对一致）**：① **报考费 = 每生每科 40 元 → 4 科共 160 元**（⚠️ **与北京标准 138 元/人不同**，缴费时按广东口径）。② 广东全省 **53 个报考点**；深圳 3 个（4411 市招考办 / 4427 深大 / 4429 南科大）。③ 深圳分流规则与 `sz_exam_point_1009` 一致（报其他院校 → 4411）—— **两份公告交叉验证，结论唯一**。④ 报考条件：『工作或**户口所在地**在广东省的往届生』—— **按户口报考只需广东户籍，不需要社保**（按工作地报考才需社保证明）。⑤ **逾期不得补报名（缴费）和提交核验材料**；深圳另有细化窗口（10/26-10/30 审核 / 10/31 12:00 补传截止）→ **以报考点公告为准**。⑥ 重复缴费部分退还；**已报名但缺考不退**；缴费后勿立即注销银行卡。⑦ 学历（学籍）网上校验未通过者须在招生单位规定时间内完成核验（已通过者无需上传学籍材料）。"

  sz_exam_point_1009: "**10/9 用户决定『回深圳考』→ 深圳市招考办 2027 报名须知要点（2026-10-08 官网发布，原文已逐条核）**：① **深圳共 3 个报考点**：深圳市招考办 **4411**、深圳大学 **4427**、南方科技大学 **4429**。② **分流规则（硬性，选错=报名结果无效）**：报深圳大学 → 必须选深大报考点；报西北工业大学 / 南方科技大学 → 必须选南科大报考点；**报其他院校（含北邮）→ 必须选『深圳市招生办报考点』4411**；初试科目含画板类、非常规用纸或超 3 小时的 → 必须选所报考院校。③ **4411 报名条件（四选一）**：广东省户籍或在粤高校应届生 / 教学点在粤的成人高校应届生 / **工作或户口所在地在广东的往届生** / 报考广东招生单位的在粤实习生。④ **上传材料**：**广东户籍 → 户口本个人页**；**非广东户籍的在粤工作往届生 → 在粤参加社保证明（不限参保月数，广东政务服务网可下载）**；在粤就读应届 → 学生证内页；在粤实习 → 实习证明（盖公章）。⑤ **审核 10/26-10/30**，材料不符须 **10/31 12:00 前**补传，逾期视为未完成。⑥ 关键信息不可改：报考单位 / 报考点 / 考试方式（错填须取消报名重报，**已缴费用网报结束后系统自动退还**）。⑦ **容量风险**：报考集中超容量时省考试院可临时关闭报考点或调整考生到其他报考点 → **预报名首日（今天）就报是对的**。⑧ 已成功报名但缺考 → 报考费不退；重复支付部分退还。⑨ 初试时间再次确认 **2026-12-19/20**。来源：https://szeb.sz.gov.cn/szzkw/qt/tzgg/content/post_13009605.html"
  bupt_notice_1009: "**10/9 预报名当天实测要点（用户提供北邮 + 北京市公告原文，逐条核过）**：① **四项关键信息提交后一律不可改** ——「**报考单位 / 报考点 / 考试方式 / 专项计划**」，**无论是否缴费**；要改只能在 10/24 22:00 前**取消报名、重新报名并重新缴费**。② **在京报考门槛**（北京市公告三·四）：非应届 / 非单独考试 / 非画板类考生，须**具有北京户籍**，或**报名当年（1-9 月）在京连续缴纳 6 个月（含）以上基本养老保险或基本医疗保险** → 不符合者必须选**工作所在地或户籍所在地**报考点。③ 填报四步：报考单位 → **备用信息** → **报考专业** → **报考点**；**北邮公告对「备用信息」未提任何要求 → 留空直接下一步**（页面原文：『如无明确要求不用填写』）。④ 缴费：北京 138 元/人，**10/24 22:00 前网上支付，逾期不接受补缴**；取消报考 / 重复缴费 / 报考点审核不通过 → 研招网对账后退费（预计 12 月底），其余情形**一律不退**。⑤ **预报名阶段已填信息 + 缴费 + 生成报名号 = 正式报名阶段无需重复报名**。⑥ 照片：**学信网 App 在线拍摄并上传**（2027 起网报与网上确认一体化，无独立现场确认窗口）。⑦ 报考点资格审核：10/26-10/31，需补材料者截止 **10/31 12:00**。⑧ 准考证考前 10 天左右自行下载，A4 打印、正反两面不得涂改。⑨ **今日实际填报值（10/9 09:1x 截图核对）**：招生单位 11(北京市)-10013(北京邮电大学) ✅ / 考试方式 21(全国统一考试) ✅ / 专项计划 0(普通计划) ✅ / 报考类别 11(非定向就业) ✅。**⑩ 待定风险点：报考点（第 4 步）** —— 用户所在地为乡村（非在京），若无北京户籍或京内 6 个月社保，**必须选户籍/工作所在地报考点**；该省报考点清单需查该省公告。"
  pre_register_done_1009: "**✅ 预报名已完成（10/9 上午，硬日历解除）**。**报名号 441198479（已交费）**。逐项核对（用户 11:2x 截图，全部正确）：报考单位 **10013(北京邮电大学)** / 考试方式 **21(全国统一考试)** / 专项计划 **0(普通计划)** / 报考点 **4411(深圳市招生办公室)** / 报考院系 **003(计算机学院（国家示范性软件学院）)** / 报考专业 **085404((专业学位)计算机技术)** / 研究方向与学习方式 **00(不区分研究方向) 1(全日制)** / 考试科目 **101(思想政治理论)；201(英语（一）)；301(数学（一）)；408(计算机学科专业基础)** ← **11408 卷型实测验证通过**。→ 依据北京/深圳/广东三份公告：**预报名阶段填完信息 + 缴费 + 生成报名号 = 正式报名阶段无需重复报名**；关键信息（报考单位/报考点/考试方式）此后不可改。**后续待办（不进学习时间）**：① 10/26-10/30 关注报考点审核结论；② 10/31 12:00 前如需补材料必须上传；③ 考前 10 天左右（约 12/9）下载准考证。"
