  sleep:                       # 睡眠是一级 KPI：政治与数学都是上午 08:30 开考
    dashboard_bug_1009: "**⚠️ 看板睡眠口径 bug（10/9 早启动核出，`dashboard.ps1` 未改 —— 该文件在职责表中标注为『只读』，改它需用户授权）**。`dashboard.ps1` 第 181 行：`$lateNights = @($recentSleep | Where-Object { $_.SleepAt -ne '' -and $_.SleepAt -gt '00:30' }).Count` —— **这是字符串比较**，于是 `'23:39' -gt '00:30'` 返回 **True**（因为 '2' > '0'）→ **所有 23:xx 入睡的夜晚都被误判为『晚于 00:30』**。**实际输出**：看板报『近 7 日入睡晚于 00:30 的天数：6』；**正确值 = 4**（近 7 日逐夜：10/3 00:56 ✓ / 10/4 23:46 ✗ / 10/5 23:39 ✗ / 10/6 00:43 ✓ / 10/7 00:42 ✓ / 10/8 03:30 ✓ / 10/9 23:54 ✗）。**正确口径 = 入睡分钟数 m ∈ [30, 720) 才算晚**（即凌晨 00:30-11:59 入睡；23:xx 属当晚，不算）。**处置（修复前有效）**：协议 B 第 0 条与任何『是否晚睡』判断**一律用 `sleep_log` 逐日手算，禁止引用看板这一行数字**；看板其余字段（倒计时 / 各科累计 / 缺勤 / 平均睡眠）经核无误。**影响面**：若照看板数字走，会**系统性高估晚睡天数** → 可能触发本不该触发的『不加压 / 降级』，也可能掩盖真实趋势（23:xx 的改善看不出来）。"
    target_sleep_at: "22:30 上床 → 23:00 合眼（硬上限，无例外）"
    target_wake_at: "06:30 离床（硬，无例外；不是睁眼时刻 —— 10/5 实测睁眼 07:49 / 离床 08:29）"
    min_hours: 7.0             # 10/8 口径补充：判「睡眠不足日」看**主段**，不看总时长（10/7 总 8h27m / 主段 6h38m）
    min_hours_phase_condition_1010: "**10/10 新增时相伴随条件（单日实测支持，待 10/11 复核）**：`min_hours` 只覆盖『量』，缺『时相』—— **主段 ≥7.0h 但入睡晚于 01:00，仍计入睡眠不足日**。依据：10/9 夜主段 **7h35m（记录期首次超 7h 线）但入睡 02:42** → 10/10 全天状态崩（用户原话『状态差得要死』）、专注仅 **64'**；对照 10/3 夜入睡 **23:46 / 主段 6h36m** → 次日 10/4 产出 **8h18m（记录期最高）**。**→ 主段更长 ≠ 恢复度更好，入睡时相是独立变量。** 本条的预测在 10/10 早启动时已事先写明（『若上午仍崩 → 证明 7h35m 在错位时相下也不够』），当日命中。"
    warn_sleep_at: "00:30"
    baseline_avg_sleep_at: "03:38"   # 手表 9/23-9/29 平均入睡时间（规律性偏差 2-3 小时）
    exam_morning_note: "上午场（政治 + 数学）= 250 分依赖生物钟；平均 03:38 入睡 = 当前最大隐性风险，优先级高于任何单科进度"
  attention:                   # 9/30 新增 KPI：注意力是 P0 资源，用分钟数管，不用意志力管
    max_planned_loss_minutes: 30
    measure: "日志「时间损失账」一栏：非计划损失（信息流 / 超时午睡 / 无记录空档）合计分钟数"
    judge: "连续 3 天 ≤30 min = 习惯切换第一步；7 天内再出现 ≥60 min 的单次泄漏 → 升级措施"
    loophole_note: "9/30 实测：卸载 B 站后当天即迁移到 X（25 min）→ 规则必须覆盖整类信息流，不能逐个 App 打补丁"
  judgement_rule_1009: "**判定口径修正（用户 10/9 21:45 提出，原话：『时间真的没所谓吧，主要还是看进度，今天数学一共肝了五节课』）**。**背景**：我用『数学 174'、保底 180' 差 6'』去总结 10/9，用户指出这是抓错指标。**数据支持用户**：10/9 数学推进 **第 46-50 讲共 5 节**，174' ÷ 5 = **34.8'/节**，比 `course_audit_1006` 的预算（50-75'/节）**快 30%+** → 当天数学是**进度最好的一天之一**，用分钟数判它『失守』是**把过程量当结果量**。**新口径（10/10 起）**：① **主判据 = 交付物** —— 数学记**讲次区间 + 闭环状态**；408 记**题号区间 + 正确率 + 错题号**；② **时间只作记录，不单独判达标**（`kpi.math_minutes` / `cs408_minutes` 保留为『投入参考』，不再作为唯一判定）；③ **唯一保留的护栏（不美化进度，宪法第 6 条红线）**：**一节/一块算『闭环』需要『视频 + 笔记』或『视频 + 题』** —— 只看视频记『过』，不记『完成』；按此口径 10/9 数学 = **46-48 讲闭环 ✅ / 49、50 讲只看视频（笔记待补）**。④ 与 `flags.user_feedback_1009`（每天只总结一次）配套执行。"
