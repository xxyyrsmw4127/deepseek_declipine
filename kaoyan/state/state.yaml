    scope_audit_1006: "**10/6 · 教材目录 vs 数一大纲核查（用户提供的外部报告，我逐条核过，判断质量可信）**。核对对象＝同济体例《高等数学》下册目录（第八章 向量代数与空间解析几何 → 第十二章，5 页目录）；基准＝数一大纲高数部分。**核验结论：报告列的 8 项『超纲』与数一大纲一致**（一致收敛性 / 绝对收敛级数的性质 / 一般曲线坐标中计算二重积分 / 一般曲面坐标系中计算三重积分 / 反函数组的偏导数 / 势场·向量微分算子 / 复数形式傅里叶级数与矩形区域二元傅里叶展开 / 含参量积分 —— 数一均不要求）。**可直接用于砍范围（协议 G：只砍范围不砍时长）**：① **多元积分学段整节跳过**＝第九章 §2.3（*）一般曲线坐标中计算二重积分、§3.3（*）一般曲面坐标系中计算三重积分、第十章 §3.4/§3.5（*）势场·向量微分算子（后者可作背景阅读）；② **若课程/教材含『含参量积分』一章 → 整章跳过**（数一/二/三均不要求）；③ 第十一章 §4（*）函数项级数与一致收敛性、§3.3（*）绝对收敛级数的性质、§8.4/§8.5（*）复数形式傅里叶级数 —— **级数章已于 10/1 前学完，此三条仅作二轮回看时的『可跳』标记**。**报告指出 3 个缺口（要补，但属『会解』级，不是重修）**：**伯努利方程 / 全微分方程（含『由全微分求原函数』，常与『平面曲线积分与路径无关』合并命题）/ 微分方程简单应用（几何＋物理建模）** —— 用户常微分方程已随上册学完，**此三项各按 20-30 min 专题处理，不重开一章**；补的时点＝进入多元积分学之前或二轮，**不占 P1 主线**。**待确认（目录看不出，需翻正文，非紧急）**：§9.5 点函数积分的应用是否含曲面面积/质心/转动惯量/引力/功、§10 §1.3 是否含全微分求积、§8.5 是否含空间曲线在坐标面上的投影、上册是否覆盖泰勒两种余项与定积分的物理应用。**限定（重要）**：报告对的是**教材目录的章节号**，而用户实际主线是**苏德矿视频（讲次编号）** → 章节号需映射到讲次；映射不上时**按内容名跳**（如『一般曲线坐标』『含参量积分』）。**这份报告的最大价值不在『补』，在『砍』——它把『哪些 * 节可以整节跳过』变成白纸黑字，对 10/25 硬截止是净省时间。**
    course_audit_1006: "**10/6 · 苏德矿《微积分三》36 节 vs 数一大纲逐节核查（结论：无超纲，整门可照跑）**。课程结构＝6 周 × 约 6 节：W1 三重积分（1-5）＋第一类曲线积分（6-7）；W2 第一类曲面积分（8-9）＋点函数积分与物理应用（10-13）；W3 第二类曲线积分（14-21）；W4 第二类曲面积分（22-26）；W5 斯托克斯＋散度旋度（27-30）；W6 傅里叶展开（31-36）。**核查结果：36 节全部落在『多元函数积分学 ＋ 无穷级数（傅里叶）』大纲范围内，没有任何需要整节跳过的内容。** 且**课程已替用户剔除教材里全部带 * 的超纲节** —— 逐条对照：教材 §9.2.3（*）一般曲线坐标中计算二重积分 → 课程无（第 3 节只到柱面坐标）；教材 §9.3.3 的『一般曲面坐标系』 → 课程无（第 3/4/5 节只有柱面、球面）；教材 §10.3.4（*）势场、§3.5（*）向量微分算子 → 课程无（第 30 节只到旋度）；教材 *第十二章 含参量积分 → 课程完全没有；教材 §11.4（*）函数项级数与一致收敛性、§8.4/§8.5（*）复数形式傅里叶与矩形区域二元傅里叶 → 课程无。**一项缺口就此闭合**：`scope_audit_1006` 中报告指出的『全微分方程缺失』→ **课程第 20 节直接覆盖**（原文『（三）求 Pdx+Qdy 的原函数、（四）解全微分方程』）。**仍待确认的缺口只剩 2 项**（不在这门课里，属常微分方程段）：**伯努利方程**、**微分方程简单应用（几何＋物理建模）** → 需用户确认上册讲没讲；未讲则按 20-30 min 专题处理，**不重开一章**。**体量算术（今日新增风险，决策点 10/8，不在今天动）**：36 节 × 实测单节成本 50-75′（实证：第 38 节 41′ 视频＋33′ 笔记；第 39 讲 10+18+23′＝51′）≈ **30-45 h**；19 天 × 数学 180′ ＝ **57 h**；线代 6 章（有课内基础，2-3 h/章 ≈ 12-18 h）＋概率 8 章（未开，2-3 h/章 ≈ 16-24 h）→ **总需求 58-87 h vs 可用 57 h，缺口 1-30 h** —— 与 10/2 重排留下的『概率在 10/25 前无处安放』是同一个问题。"
