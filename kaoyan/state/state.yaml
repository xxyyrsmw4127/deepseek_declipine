rules_1013:                     # 用户 2026-10-12 19:5x 提出的「规则系统」诉求，当轮落盘
  rule_21_rules_over_willpower:
    text: "用户原话：『6.5h 都是不够的，4.7h 还是别提了……事实上是因为我情绪状态起伏导致我有些天进度几乎为 0 导致的。所以我罗列的规则都是有必要的，接下来不能单靠意志了，接下来两个月我得当做规则怪谈去玩才行』"
    diagnosis_correction: "**认领一处督学误判**：本日择校推演把『日均 4.7 h』当作用户的能力水平 —— **错**。4.7 h 是**被情绪低谷日拉低的均值**，不是能力上限。同一个人在高产出日实测：10/4 8h18m（记录期最高）、10/5 7h26m、10/11 7h13m（数学单日 204′ 最高、推 6 讲、双保底双达标）。→ **能力不是瓶颈，稳定性是瓶颈。**（与 AGENTS.md 第 15 条同理：低状态是睡眠与情绪的后果，不是意志力问题。）"
    design_principle: "**规则的作用 = 在情绪低谷时替用户做决定，让他不必依赖当时的意志力。** 因此规则必须少（3-5 条）、必须能自动执行、必须在制定时（清醒状态）而不是执行时（低谷状态）做判断。"
    user_original_rules_kept: "用户 10/12 提出的三条午间规则（13:00 后不午睡 / 13:30 回桌 / 午间不许自慰）保留在 `rules_1012.rule_20_noon_lock`，本就是本系统第一条。"
    core_3:
      - "① **锚点不可协商**：21:30 关屏 → 22:30 上床 → 23:00 合眼 → 06:30 离床。**情绪好坏与锚点无关**，这是当日一级 KPI（承 `rules_1008.rule_19`）"
      - "② **每天两次「启动」，每次允许最小**：低状态日的启动块 = **15-20 分钟**（遮答案重做错题 / 只读考点速览 / 只做题不看课），**上午一次、下午一次，累计 ≥30 分钟**。**启动之后不许停手，接着做下一个块。** —— 这条专治『进度几乎为 0』的日子；设两次是因为单次门槛过低，一次 20 分钟不足以把『0 产出日』变成『有产出日』"
      - "③ **每天只报数据、不做情绪评价**：报数 = 题号区间 + 正确率 + 闭环几讲；**不报『今天状态不好』**（讲一次，不许自我加刑）。情绪不记入 KPI，也不作为减小任务的合法理由（唯一例外 = 宪法第 16 条 degraded 的三个硬判据）"
    full_rule_list: "**R1-R13 全文与处罚表见 `kaoyan/state/规则清单.md`（唯一版本，与本节点冲突时以该文件为准）** —— 含 10/12 新增的 **R5 学习块内手机 off + 离桌**、R7-R9 午间三条、R10-R13 作息细则，以及按自然周累积的处罚阶梯。"
    auxiliary:
      - "④ 90-100 分钟一块，块间 15-25 分钟换通道（走 / 拉伸 / 干活 / 音乐，**刷手机不算**）—— 承宪法第 13 条"
      - "⑤ 每天一次 45-90 分钟深恢复（首选出门走路 + 听歌），**与数学、408 并列排程**，不是奖励、不许砍"
    strength_evidence: "**该系统的强度已实测证明**：10/11（06:23 离床 → 07:21 开工，间隔 58′ 记录期最快）当天数学 204′ 推 6 讲、408 178′ 双模块、英语 2011 T1 全对 —— **说明「状态一般 + 规则完整」能产出记录期最好的一天**。"
    purpose: "把「能不能考上」从意志力问题转化为系统问题（承宪法第 13 条「80 天的目标是机器不宕机，不是每天输出最大化」）"
    effective_from: 2026-10-13
    window: "2026-10-13 ~ 2026-12-18（67 天）"
    acceptance: "① 每日锚点连续命中率；② 零产出日的数量（目标 = 0）；③ 每周双保底日数（10/13-10/22 目标 ≥5）"
    progress_1013: "**规则系统生效第 1 天（10/13）实况**：① **起床端 06:38（锚点 06:30 晚 8′，判定线 ≤06:45 → 计达标）** = 连续第 2 次命中，比前夜早 39′；② **合眼端破 62′**（00:02 vs 23:00）—— 比 10/12 夜的 83′ 收窄 21′，**连续第 2 夜落在 01:00 之前，10/9 以来首次**；③ 主段 6h36m < 7.0（差 24′）→ **睡眠不足日连续第 4 天，累计睡眠债 −3h28m**；④ **规则 18 计数：S = 5 / D = 5**（10/9-10/13），S 未达 7 → 今天不触发补偿日，**最早可用 10/16**；⑤ **本夜（10/13 夜）的关键性**：今晚是规则系统第一个**完整闭环考核夜**（规则于今日 06:30 起生效，10/12 夜因跨生效点不溯及既往）；⑥ 今天的第一 KPI = **21:30 关屏 / 22:30 上床 / 23:00 合眼 + 明早 06:30 离床**，第二位 = **408 补上（已连续 6 天未达 180′）**。"

