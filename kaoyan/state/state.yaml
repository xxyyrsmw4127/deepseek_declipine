  sleep_structure_1002: "**口径修正（10/2）**：不要用『总时长 7h39m』当成绩，要看结构 —— 主段 23:31-02:56（3h25m）+ 清醒 2h19m + 第二段 05:15-09:29（4h14m）。App 里显示『4 小时 14 分钟』就是第二段长度。判据：醒来第一反应是『我要先洗掉脸上的东西』→ 判为**护肤时间表问题**，不记入生物钟/意志力账。"
  sleep_trend_1001: "10/1 01:14 入睡 / 7h13m；9/30 01:52 / 6h13m。入睡时相连续两日前移共 38 min，7 日均值 02:55。判据更新：`sleep_at` 晚于 00:30 的计数按最近 3 天口径为 3/3（9/29 01:11、9/30 01:52、10/1 01:14），但 10/1 睡眠时长首次达标（7.2 h ≥ kpi.sleep.min_hours 7.0）→ 10/1 不执行强制降级，改为把「22:30 上床」设为当日并列第一 KPI（依据协议 B 第 0 条的例外：时长已达线且时相两天连续前移）"
  phase_plan: "调时相只靠固定起床锚点：**06:30 离床（10/8 锁死，替换原 07:00；不管几点睡着）** + 午睡 ≤25 min 且 14:00 前结束 + 咖啡因 14:00 后禁；**22:30 上床 + 23:00 合眼是硬约束，不变**"
  phase_plan_1010: "**10/10 口径修正（实测驱动；触发＝用户当日提出『我甚至在思考有没有必要放弃作息规律这些考虑，就一昧追求高学时和效率就够了。正如昨晚那样，有时候这个作息规律都不是能随便控制的』）**。**旧口径（10/7 写）**：『自然醒点不可控，**入睡时刻是唯一可控旋钮**』。**10/9 夜实测推翻其一半**：23:00 合眼**已做到**（规则 19 首次命中）但仍 02:42 才睡着 → **入睡时刻同样不可直接控制**。**新口径（三句）**：① **入睡端 ＝ 不可直接控制**（23:00 合眼 ≠ 23:00 睡着，实测潜伏期 3h42m）；② **起床端 ＝ 100% 可控**（闹钟 + 离床，不需任何生理条件）；③ **两端单向耦合**：固定起床 → 睡眠压力累积曲线稳定 → 入睡时刻被动前移（**成立**）；提早上床 → 入睡前移（**不成立**，10/9 实测）。**⇒ 操作版本：放弃对入睡端的控制欲，只锁『06:30 离床』一个变量，连续 3 天不管几点睡着。** **『放弃作息换高学时』的证伪数据（已成交过的对照实验，不是推演）**：10/6 延到 21:55 关屏 → 数学 256'（九天最高单日）→ **代价 10/7 全天 1h11m，净账＝多换 56' 赔掉 5-7h**；且产出最高的两天恰是起床最早的两天（**10/4 起床 06:22 → 开工 07:29 → 8h18m 记录期最高**；10/9 起床 06:20 → 408 首次达标），**今天起床最晚（10:18）→ 产出最低（64'）**。**→ 『高学时』与『早起』在数据上是同一件事，不是对立项。**"
  sleep_productivity_chain_1003: "**10/3 晚 · 用户自建因果链（原话，据此把作息升为一级 KPI）**：『意志力和大脑算力本身和我的睡眠高度挂钩，直接决定了我白天的清醒时间；清醒时间的长短决定了意志力得以放松休息的间歇能变多；清醒的强度能决定大脑算力的恢复速度；更别说早睡早起本身也就意味着工作强度能更高。』＋『22:30 确实得闭眼了，而且确实得 7:00 左右甚至 6:30 早起』。**该链与 10/2→10/3 实测完全吻合**：10/2 睡眠劈两段（主段 3h25m + 清醒 2h19m）→ 当天 4.6 h + 消沉 + 午睡睡不着；10/3 睡眠 7h26m / 清醒 0 / 效率 100% → 当天数学 186'（六天最高）+ 408 116'。**算术**：现 08:22 起 → 09:40 开工（浪费 78'）；若 06:30 起 → 07:00-07:30 政治窗口 → 07:30 开工 ⇒ **+2h10m/天**；再回收零散空档 ≈ +1h/天 ⇒ 日产 **5.5h → 8.5h**；**76 天 × 8.5h = 646 h ≥ `budget.hours_estimated_need` 630 h**。**结论：算术上通，且是当前唯一不需要牺牲睡眠的解 —— 作息不是养生，是产能杠杆本身。**"
  north_poly_judgement_1003: "**同晚用户判断『现在这个速率我几乎百分百肯定北邮是不可能的，一眼望得到头』的督学口径**：① **按当前速率（5.5 h/天）该判断成立** —— 76 × 5.5 = 418 h ＜ 需求 630 h，缺口 212 h，**不粉饰**；② **按新速率（8.5 h/天）该判断不成立**（646 h ≥ 630 h）；③ **但两者都不是今天要回答的问题** —— 择校判据在 **10/8**，只用一个量：**10/4-10/7 四天的实际执行度**，用落盘数据判、不用感觉判；④ **即使最终按 `hedge` 改报 085412 网络与信息安全：同为 11408 卷型，四科学习内容一字不改** → 『北邮行不行』不改变明天做什么，不构成今天的行动依据。"
  wake_anchor_fix_1001: "10/1 实测起床 08:27（锚点 07:00，晚 1h27m）→ **时相后移的另一半在起床端，仅提前入睡不够**。回拉阶梯（两天到位，不用一步跳 07:00，避免强制起床导致睡眠债）：10/2 起床 07:30（闹钟，无论几点睡着）→ 10/3 起 07:00。配套：午睡 ≤25 min 且 14:00 前结束；咖啡因 14:00 后禁；22:30 上床不变。判据：10/3-10/5 连续 3 天起床 ≤07:15 且 sleep_at ≤00:00 → 视为时相已回拉，风险降级。"
  conclusion: "不是不适应，是摆烂期（困到受不了才睡 / 早上八点睡到下午五点）造成的睡眠时相延迟；质量端已正常 → 只需固定起床时间，禁止补觉"

