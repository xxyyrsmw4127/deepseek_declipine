  platforms_scope: "整类信息流：微博 / 小红书 / 知乎 / 抖音 / B站 / X / 贴吧 / Reddit —— 有则登出并卸载；微信只保留通讯功能，发现页的视频号/直播入口关闭"
  rule: "学习时段手机放另一个房间（充电器也放那个房间，取用必须起身）；短视频/自媒体/信息流 App 一律不安装或不留登录态；当天再因刷信息流产生空档 → 当晚 21:30 关屏提前到 21:00"
  block_boundary_rule: "块边界的休息只许三选一：① 出门走 5-15 min ② 拉伸/俯卧撑 ③ 洗把脸/接水（不带手机）。休息时手机不在手上 —— 今天的 217 min 全部发生在『手机在手上 + 下一个动作不明确』的真空里"
  family_interruption_protocol: "10/1 新增（应对父亲一方的连续占用）：① 学习时段手机静音，家人消息**积压到块边界统一处理**，块内一律不回；② 人情/跑腿/钱账类事项**只允许在 21:00 后的收尾窗口讨论，单次上限 15 min**，超时即中止（『明天再说』是合法终止语）；③ 需要外出的体力事（取快递等）**并到晚间的深恢复时段**，当走路锻炼的一部分，不做成额外任务；④ 涉及人身边界的事（理发等）**换到外面解决**（快剪店），把「要不要接受」的谈判空间直接清零；⑤ 被拖欠的 811 元：**本周不催、不复盘、不刷对话框等回复**，挪到 10/8-10/12 的硬日历窗口处理（那几天本就是考务日）。判定标准：当天因家庭冲突产生的**非学习占用与反刍时间合计 >60 min → 当天标记 `external`**，按宪法第 11 条处理，不记欠账。"
  legal_window: "信息流唯一合法窗口：21:30-21:45（≤15 min，仅电脑浏览器，不装 App）"
  relapse_ladder: "单日泄漏 ≥60 min → 当晚 21:00 关屏；7 天内两次 → 手机交家人保管 或 换功能机（不依赖意志力的兜底）"
  political_depression_1004: "**10/4 新增（用户自述命名，原文『看到这种事非常容易政治抑郁』『我厌恶这一切』）** —— 定性：这是**输入管理问题，不是立场或认知问题**，更不是需要被说服的问题。**协议（三条）**：① **不与用户辩论该议题的内容**（无论哪一方），也不做心理疏导 —— 督学只做两件事：识别诱因、执行处置；② **识别**：此类内容 = 已知诱因，**接触即触发，接触越深越出不来**，与"想得对不对"无关；③ **处置 = 物理切断 + 换通道**（宪法第 13 条：通道全空 = 真空 = DMN 接管；反刍无法靠意志力停止，只能靠换通道打断）。**实测成本（10/4）：单次泄漏 68 min（09:34-10:42），为当日最大单项损失，超过政治整段产出（25'）。** 此类议题的合法窗口仅 21:30 后 ≤15 min；**泄漏日没有窗口**（10/4 因泄漏 ≥60' 已提前到 21:00 关屏）。"
  macro_topic_rule: "宏观议题（民粹/男女对立/AI 治理等）只允许 21:30 后、≤15 min，禁止出现在学习时段"
  evidence: "9/30 两次：10:23-12:05 晾衣服后打开短视频 → 102 min 零产出；18:06-18:31 刷 X → 25 min 零产出。当日非计划损失合计 217 min ≈ 全部学习时长（4.6h）的 78%；触发点都不是『想刷』，而是任务间隙的真空"

