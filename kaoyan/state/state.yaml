    done_1013: "**10/13 408 = 178′（iHour 四条：07:30-07:38 8′ 错题复习 / 13:34-13:55 21′ 图概念视频 / 14:00-15:01 61′ 6.1 题目做完批改完 / 15:39-17:08 88′ 图存储学习+做题+批改完毕）** —— 第 6 章 图：**6.1 ✅（6.1.1 单选 01-18 全做，错 2 = 08、12）· 6.2 ✅（p207-208 的 01-20，错 1 = 笔误）· 6.3 ⏳ 未开**。**408 从 10/12 的 0′ 补到 178′，是恢复期第 3 高单日。** **R 类升级判据今日命中**（12 题 = 用『弱连通』判据回答『强连通』）→ 处置：读题时在题号旁标『问的是哪一档』，做题顺序固定为先找环再数分量。**用户反馈**：『学的时候感觉很吃力，但感觉考的好像没那么深』→ 登记为待验证假设（验证点 = M5 真题分章）。"
  english:
    method_1005: "**英语精读方法（用户 10/5 晚澄清，以此为准）**：用户**一直在做精读**，形态是『做完题 → 重读英文、心里试译全文 → 把每个不认识的语素查清搞懂』（即**默看+内心翻译+语素级查词**），**不是**逐句手写翻译。→ 我此前把 `english.no_repeat_rule` 里的『限时 18 min → 精翻 → 生词 3-5 条 → 3 句主干剥离』默认成"手译"，属口径误判。**裁定**：① 用户的默译已是精读，**成本更低、可持续**，不要求改成手译；② **手译不是每篇都做**，只在**单篇错 ≥3 题**（如 10/5 的 2010 T4 = 2/5）时**只译错题对应的 2-3 句**，用途是暴露『以为读懂了但译不出来』的那几个点；③ 例证题/态度题答错时，加做一步『**回原文标出证据句**』（成本 2 分钟）；④ 禁止为提高"精读完整度"把英语块撑到 60' 去挤 408 —— 英语块上限 45'。"
    zhangjian_1005: "**张剑 80 篇（用户 10/5 晚提出，三版口径逐步升级后定稿）**：① 最初口径 = 只跟课 2 倍速过生疏词，不阅读；② 修正 = **词汇仍只过词、一篇 ≤20'**；③ 最终 = **阅读也做，用 LLM 辅助**。**定稿规则（三条，硬约束）**：**(a) 主副位次**：真题永远是主菜（每天 1 篇、18' 限时），张剑 80 篇是配菜；**真题未做时不许碰张剑**。**(b) 三个窗口**：词汇过词（≤20'/篇）→ 只在走路/三餐/洗澡（不占数学 408）；阅读（做题 + LLM 辅助理解）→ 只在**英语块内**，且**单篇 ≤30'**、**每周 ≤2 篇**、**不得挤占真题的 18' 限时位**；超出 45' 英语块上限即停（今日 100' 英语已超 2.2 倍，为 408 停在 121' 的直接原因）。**(c) LLM 的合法用法**：**只许做三件事** —— ① 拆长难句主干 ② 解释生词/术语（语素级）③ 复核我的译文。**禁止**：替做题、直接给答案、整篇代译后用中文理解。**理由（本工作区已发生的偏差）**：10/5 T4 第 36 题选错，根因是『两个 rules 分不清』——LLM 代读会把这个缺口盖住，考场上没有 LLM。**正确顺序 = 先自己限时做 → 再用 LLM 对答案/拆句**。**(d) 第四形态「听课不做题」（用户 10/8 19:34 授权新增，放宽 (a) 的绝对禁令）**：允许在**低状态日 / P0 未启动日**听张剑精读课、不做题，作为**低阻力启动动作**（信息量低于做题，但优于 0 产出）。约束：① **单次 ≤30′**；② **每周 ≤2 次**；③ **不得替代真题的 18′ 限时位** —— 当天若有英语余量，**真题排第一件**；④ **听课不计入真题进度**（下一站仍是 2011 Text 1）。**首用记录**：10/8 19:34 用户提出「洗完澡学英语：看单词 + 张剑八十篇精读课（不做题直接看课）」，当日 P0 = 0、状态奇差 → 属 (d) 的适用情形；**该块实际未执行**（用户 21:39 报「关屏休息了，今日进度为 0」）→ **(d) 形态尚无任何实测成本数据**。"
    stage: "词汇一轮完成 / **2010 年四篇（T1 3/5、T2 3/5、T3 4/5、T4 2/5，均分 60%）→ 2011 T1 = 5/5（10/11 首销）→ 2011 T2 = 2/5（10/13，错 3 题）** —— 下一篇 = **2011 Text 3**（同日纠正：我此前写成「2011 Text 1」却是被 10/3 的旧记录误导为“已排未做”，实际顺序是 2010 T1→T4 已闭、下一站 2011 T1；`english.no_repeat_rule` 内「2011 Text 1」指代正确、只是提前了 4 天）"
    done_1013: "**10/13 英语 = 32′（iHour 两条：17:33-17:51 18′ 词汇复习 / 19:10-19:24 14′ 真題刷题「11英一 真题 text2 做完」）** —— ① **2011 Text 2 成绩 2/5（错 3 题）**，用时 **14′ < 18′ 限时**（提前 4′）；② **用户自评（原话）**：『**5 错三，应该是不难的，但是太多生词了**』→ 与 `vocab_audio_loop.problem`（『**词汇大批遗忘，直接影响做题速度与准确率**』）以及 2010 T4（2/5，经管金融题材、生词密集）**同源**；③ **与 10/11 的 2011 T1 = 5/5 构成对照** —— 同一套卷内相邻两篇差 3 题 ⇒ **『2010 偏难』的解释力下降，『生词密度』上升为主因候选**（10/11 该假设的三条对照口径已被 `english.done_1011` ②③ 写死，本条即为第 1 个对照点）；④ **处置 = 英语块内按 `method_1005` 做错题定位**（只精翻错题对应的 2-3 句 + 回原文标证据句 + 生词表追加），**不撑时间、不占 408**；⑤ **`vocab_audio_loop` 至今 0 次执行**（10/1 起设计、10/4 拟排入走路块、10/8 授权第四形态，**均未落地**）→ 本条记为首个可执行的落点：**并入走路块**（宪法第 13 条深恢复 + 词汇音频二合一），今日未走则明日排。"
    this_week_target: "**W2（10/5-10/11）计划**：2013-2015 真题阅读（每天 1 篇、限时 18'、45' 块上限）。**实际截至 10/9 早 = 0 篇新做**：2010 四篇已闭（均分 60%），**2011 Text 1 顺延至第 8 天**（10/1 之后英语块只有 10/3 的 20' 词汇听力、10/4 的 104' 2010 T3、10/5 的 100' 超时块）。**W2 只剩 10/9-10/11 三天**。｜ *（历史值，W1 口径，10/9 归档）10/2 2010 Text 1 回炉 + 2011 Text 1 限时 18 min*"
    done_1011: "**✅ 2011 真题 Text 1 完成：5/5 = 100%（用户报『13min全对』）** —— **这是真题线连续顺延 10 天后的首次销账**，也是记录期英语单篇最高分（前高 2010 T3 的 4/5 = 80%）。**用时 13′ < 18′ 限时线（提前 5′）** → 说明当前限时余量充足，考试节奏无压力。**用户自评（原话）：『不得不说这才是我的实力。看来是10年的阅读太难了』** —— **督学口径：本条只登记，不下结论。** 理由：① 『2010 偏难』的对照组数据（2010 均分 12/20 = 60%；2010 T4 = 2/5 = 40%，用户自述为经管金融题材 + 生词密集）**支持方向**，但**n = 1 篇不足以定论**；② 用户 10/2 曾自述『**词汇大批遗忘，直接影响做题速度与准确率**』（见 `vocab_audio_loop.problem`）—— 生词密度是比『年份难度』更可操作的变量，**两者在 2010 T4 上是重叠的**，需 2011 T2-T4 用同一口径做三篇对照才能分开；③ **裁判数据在 2011 剩下的三篇里**：若 T2-T4 维持 ≥4/5 → 『材料难度差异』成立，处置 = 不因单篇低分调整方法；若回落到 3/5 → 『词汇/题材』仍为主因，处置 = 按 `vocab_audio_loop` 恢复音频复习（并入走路块）。"
    done: "10/1：2010 Text 1 精读 69 min（19:50-20:00 + 20:00-21:00，精读课 + 敲写笔记）；**24 题改对（正确 A）**、25 题为争议题（官方 B，三源不一致，不计正确率）→ 本篇 **4/5 = 80%**；生词表 35 条（含 6 处「认识但译不出」的实词）"
    no_time_limit_1013: "**⚠️ 限时口径作废（用户 2026-10-13 19:4x 提出，原话：『之前你这边一直有要求英语阅读保持在 18min 一篇，但事实上这完全不符合我现在的情况。不应该有任何限时，不然根本无法保证我能通读文章正常做题』）**。**旧口径**：`english.no_repeat_rule` 里的『限时 18 min 做新篇』+ `done_1011` 的『用时 13′ < 18′ 限时线』奖励口径 → **全部作废**。**新口径（即刻生效）**：① **英语阅读不限时**，做完为止；**禁止**为卡时间牺牲通读（『通读到能判断』才是判对答案的前提）；② **唯一保留的时间记录 = 本篇用时 + 生词条数**（两者合并才能区分『读得慢』与『词不认识』，**前者才是考场上会崩的变量**，后者是词汇账，归 `vocab_audio_loop`）；③ **判据改为**：正确率 + **错题是否属『读懂了但不知道词义』**；④ **数据依据**：10/1-10/5 超时篇目（19-20′+）正确率并不高于限时篇目；10/13 的 2011 T2 **14′ 提前完成但仅 2/5**，用户自述『不难，生词太多』→ **瓶颈是词汇不是速度**，限时反而把『读不完』变成『猜着做完』；⑤ **与 `method_1005` ④（英语块上限 45′）的关系**：45′ 是**块长上限（防挤 408）**，**不是单篇限时**，两者不冲突、**不得混用**。"
    no_repeat_rule: "**已消化的篇目不做二次精读**（10/2 用户明确纠正「text1 笔记已经够充分了，英语复习不该是这样的」）：一篇的错因已定位、生词表已出、笔记已足 → 该篇**结案**，直接推进下一篇（进度：2010 T1 ✅ → **2011 Text 1**）。**禁止**把「回原文找对应句 / 重做同一题 / 再抄一遍生词」当作日常英语块的主任务——那是重复劳动，不是复习。英语每日块的结构固定为：**做新篇（**不限时**，见 `no_time_limit_1013`）→ 精翻 → 生词 3-5 条 → 3 句主干剥离**，做完就换篇。旧篇只在晚复盘抽查时偶发调用（宪法第 6 条），不单独排块。"
    vocab_audio_loop:  # 10/2 用户提出，方案定稿
      problem: "用户自述：**词汇大批遗忘，直接影响做题速度与准确率**（10/2 2010 Text 2 限时 20 min，3/5）。这比 10/1 的「被动词汇」诊断更靠前一步——**不是认识但译不出，是根本记不起来**。"
      solution: "**audio review 每天过一遍词汇笔记**（用户自用工具，已确认可用）。**工具变更（10/3 晚）**：用户改用 **Gemini 的 audio**（原写 NotebookLM）—— 形式等效（词 → 释义 → 例句的音频序列），**成本口径不变**：仍按每天 20-30 min 计入**真实时间**，**优先并入走路块**（边走边听 + 手机看笔记）；若当天没走路，则必须从英语额度里出，不额外加块。"
      cost_correction: "⚠️ **用户 10/2 纠正，方案据此改**：『是可以反复听，但实际上我依旧得花真正的时间至少边听音频边看笔记，不然不一定知道在讲什么』→ **不是零成本背景音**。真实形态是**「边听 + 边看笔记」**，因此**占用真实学习时间或真实占用眼睛/注意力**，必须从账里出。"
      how:
        - "① 生词表写进一个**固定文件**（按篇累积，不删旧条目——旧词才是被忘掉的那批），整份上传 NotebookLM → 生成 Audio Overview"
        - "② **主窗口 = 每日 30' 深恢复走路**：边走边听 + 手机看词汇笔记（走路本是必修，边走边看不冲突，且把『看笔记』塞进本来就要花的时间）→ **这是唯一能同时满足『每天一次』和『不吃学习时间』的窗口**"
        - "③ **次窗口 = 三餐 / 洗澡（无笔记可看，只做被动接触）**：纯听、不求听懂、不追内容、不占学习时间"
