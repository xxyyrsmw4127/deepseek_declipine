    judge: "**判据不看时长看这两项**：① **生词入库数**（每篇 ≥15 条进固定词表）② **旧词回忆率**（隔日抽 20 词，正确率 ≥80%）—— 时长只是记录值（承 `judgement_rule_1009`）。"
