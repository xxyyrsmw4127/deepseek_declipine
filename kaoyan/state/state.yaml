    stage_gap_1007: "**⚠️ 本条为督学误判留痕（10/9 早启动写下，同日 07:5x 自行推翻）**。初版写：`stage` 记『第 5 章树未开』与 10/8 日志记『停在 5.2.3 之后』矛盾，**成因是 10/7 未落盘、来源不可核** → 处置为『不猜、不合并，以用户回报为准』。**该判断错误**：查 `mistakes/mistakes.md` 218-228 行，**10/6 已落盘『第 5 章 5.2.3 二叉树 本节试题精选 30 题：错 3』（正确率 90%、错题号 5/19/28、计时 87'）**；`flags.notes_1006` ⑦⑧ 亦记有同一数据（『5.2.3 二叉树 30 题错 3 = 90%，为四段最高』）。→ **真相是 `stage` 字段本身没同步（停在 10/5 前的快照），不是数据缺口**；10/8 日志的『停在 5.2.3 之后』准确无误。**偏差性质**：**数据就在工作区里，我却判定『来源不可核』并据此把处置推给用户**（违反宪法第 1 条数据优先；与 10/5『漏读截图已有的 07:49』、10/2『从模糊描述推断答案』同类，属**未穷尽已落盘证据即下结论**，第 3 次）。**教训入档**：下『数据缺口 / 来源不可核』这类结论前，**必须先查 `logs/` + `mistakes/` + `flags` 三处已有记录**；查不到才允许登记为缺口。`stage` 字段已同步修正。"
    done_1013: "**10/13 408 = 178′（逐日口径第 3 高）**（iHour 逐条：07:30-07:38 8′ 错题复习 / 13:34-13:55 21′ 图概念视频 / 14:00-15:01 61′ 6.1 题目做完批改完 / 15:39-17:08 88′ 图的存储学习完毕+做题完毕+批改完毕）** —— **408 从 9/28 起连续 16 天从未达 180′，今天差 2′ 到线，是它第 3 高的单日**。**交付物（按 `judgement_rule_1009` 逐条判）**：① **6.1 图的基本概念 ✅ 闭环**（6.1.1 单选 **01-18 全做 + 批改**，**错 2 题 = 08、12**）；② **6.2 图的存储结构 ✅ 闭环**（邻接矩阵 / 邻接表 / 十字链表 / 邻接多重表 + **p207-208 的 01-20**，用户原话『做题完毕、批改完毕』）；③ **6.3 图的遍历 ⏳ 未开**（下一站）。**错题（已入 `mistakes/mistakes.md`，回炉日 10/16）**：**08**（n 顶点有向图顶点度最大值 → 误 C(2n)，正 D(2n−2)，错因＝**简单图无自环这一隐含前提没上桌**）、**12**（有向图强连通分量个数 → 误 A(1)，正 D(4)，错因＝**用『弱连通』的判据回答『强连通』**）。**另 1 题不计入**：**6.2 的 01-20 错 1 题（19/20 = 95%）**，用户判定为**看错题（一次性笔误）** → 按用户判断**不写进错题本、不计入错因画像**（宪法第 6 条）。**⚠️ R 类升级判据在今日命中**：10/11 条观察点写死『若再出现一次 R 类则升级为独立审题流程问题』→ 12 题（判据档位错：弱连通 vs 强连通）触发 → 处置＝读题时在题号旁标『问的是哪一档』（图这章三档：连通 / 弱连通 / 强连通），**做题顺序固定为先找环再数分量**。**用户反馈（10/13 17:09，原话）**：『实际上学的时候感觉很吃力，但感觉考的好像没那么深』→ **登记为待验证假设（`flags` 侧），本条只记不解释**：① 数据侧与用户判断同向 —— **6.1 = 89%（18 错 2）、6.2 = 95%（20 错 1）**，吃力主要发生在**学习/理解阶段**（存储结构的四种表示与指针域细节），不是答题阶段；② 可操作含义若为真 = **图的『细节记忆』类内容不必抠到教材深度，把力气留给大题主干**（遍历 / MST / 最短路 / 拓扑 / 关键路径）；③ **验证点 = M5（11/8 起）408 真题分章 2009-2015**，届时用真题实测该假设，**现在不据此改口径**。"
    this_week_target: "**W3（10/12-10/18）计划**：数据结构第 6-8 章一轮收口 + 计网 4.2-4.x。**组原补漏已撤出 W3**（10/17 作废，见 `flags.backlog_inflation_1017` 与 `规则清单` R16）。**10/13 实际**：第 6 章图（6.1 ✅ 6.2 ✅ 6.3 ⏳），计网 4.2 未开。"
    this_week_target: "**W2（10/5-10/11）计划**：数据结构 第 5-8 章一轮收口（走法：考点速览 → 直接做题 → 只为错题回看视频段）+ 组原补漏起手（第 2 章数据表示）。**实际截至 10/9 早**：第 5 章 **5.2.3 已完成**（10/6，30 题错 3 = 90%）；**组原第 2 章自 10/6 起被 agent 记为『挂账』、连续 3 天未开工**〔**10/17 作废：该账目系 agent 从组原网课目录反推『未学章节』后自行转写，用户从未要求学组原 → 见 `flags.backlog_inflation_1017`**〕；第 6-8 章未开。**W2 只剩 10/9-10/11 三天**。｜ *（历史值，W1 口径，10/9 归档）10/2 第3章栈 / 3.2 队列 / 10/3 第4章串 + 第5章树起手 / 10/4 树（M1）*"
    pacing_note: "**栈段实测成本 ≈116 min**（10/2：3.1 课 + 3.1.4 单选 31 题）。若队列段同成本 → 第 3 章整体 ≈240 min。M1 要求 8 章在 10/4 前走完，而 10/2 只推进 1 章 → **数据结构是 M1 的第一风险项**；10/3 起每章先看『本站考点速览』再决定是否看课，禁止 3.1 这种「课 + 全部选择」的完整走法占用整章预算（该走法单章 2h × 8 章 = 16h，M1 只剩 2 天）"
    page_based_cost_1003: "**10/3 晚 · 按王道目录页数重算（用户提供完整目录截图，推翻我此前「数据结构剩余 ≈20h」的估算）**。目录实测页数：第 3 章剩 3.3(p90-102,13p) + 3.4(p103-108,6p) + 第 4 章(p109-123,15p) + 第 5 章(p124-193,70p) + 第 6 章(p194-263,70p) + 第 7 章(p264-330,67p) + 第 8 章(p331-391,61p) = **302 页**。实测速率：3.1(p63-78,16p)=116' → 7.3 min/页；3.2(p79-89,11p)=116' → **10.5 min/页**（含 24 选择 + 4 综合 + 批改）→ 区间 **8.5-10 min/页**。**三档成本**：A 精做 302×9 ≈ **45 h**；B 粗做（选择全做 + 单题时间盒 + 综合每章 1 道 + 不回看视频）≈ **25 h**；C 扫读（做 1/3 选择）≈ **16 h**。**408 全部剩余需求**（含组原补漏 12h + OS ≈18h + 网络 ≈8h）：A 档 **83h** / B 档 **63h** / C 档 **54h**。**可用**：22 天 × 2.2 h = **48 h** → **缺口 A −35h / B −15h / C −6h；即使全走 C 档仍差 6 h。结论：10/25 的 408 一轮硬截止在任何档位下都不可达 —— 必须动硬截止或动 P1 的四科分配，靠提高执行强度补不上。**"
    real_conflict_1003: "**10/3 晚 · 我的两处误判已由用户当场纠正，此处为修正后口径。** ① **误判**：我写「用户今天做了 4 道综合应用题、是『学会』的强度」→ **错**。用户原话：**「我一直以来都是只做选择题，这几天也都是如此」**。照片里出现的综合应用题 01-04 是**题面所在页**（王道 3.2.5 末尾 + 3.2.6 解析页），**不等于用户做了它们** —— 我把「书上印着」当成了「他做了」，属于违反宪法第 1 条（数据优先）的推断。② **修正后的真矛盾**：**用户已经在用最省模式** —— 只看考点/复习 + **只做选择题** + 批改，不看完整课、不做综合应用题。**在此前提下数据结构剩余仍要 ≈48h（25 节 × 116' 实测）→ 问题不在执行方式，在总量本身。** ③ **据此作废的建议**：之前「行为上要变的四条」中，①「综合题每章只做 1 道」**作废**（他本来就没做）②「错题只记题号」**降级为可选**（他自撰错因是高价值行为，不该被削）。**仍然有效的两条**：**单题 3 分钟时间盒**（10/3 Q19 磨约 10 分钟 → 直接引发红温）、**不回看视频/不开可视化**（10/3 的 26' 复习含可视化工具，是当天 116' 里可压缩的部分）。④ **能动的东西只剩三样**：整章跳过低价值章（第 4 章串 15p、3.4 数组矩阵 6p）、把每节的理论输入从 26-32' 压到 10'（只读考点速览）、或者移动 10/25 硬截止。**这三样的取舍必须由用户定，不在疲劳状态下定。**"
    round_one_tiers_1003: "**「砍」的操作定义（10/3，回应用户问『砍 = 更粗略地过掉、还是直接跳过』）—— 分三档，不是二选一**：**A 精做**（大题主干章：第 5 章树 / 第 6 章图 / 第 8 章排序）：薄弱节看课、选择题全做、综合应用题每章 1-2 道、错题记错因 + 回看视频段 + **当天回炉**，2-2.5 h/章；**B 粗做**（中等章：第 3 章剩余节 / 第 7 章查找）：只在被错题命中处回看视频、**选择题全做但单题 3' 时间盒（无明确思路即标记跳过、做完统一看解析）**、综合题每章 1 道、**错题只记题号 + 一句话错因、不回炉、不深挖**，60-90'/节；**C 扫读**（低分小章：第 4 章串 / 数组与特殊矩阵）：**不看课**、只读『考点速览』、**选择题只做 1/3**、不做综合题、只记题号，30-40'/节。**三档共同不可省（任何档都不得省）**：① **正确率必须记**（它是二轮的地图，不是一轮的验收标准）② **错题号必须记** ③ **单题 3 分钟时间盒**。**关键纠正**：用户提的『不要求准确率』应改为『**不要求当场达标（≥70%），但必须记录**』—— 不记正确率，二轮就不知道往哪打；『为达标而重复刷』才是一轮不做的事。**整章跳过的唯一合法情形**：已用做题验证过『已会』的章节（先例：9/29 第 1-2 章跳过视频直测 88.9% 通过）；**未学过的章不允许整章跳** —— 否则二轮连『这里有个考点』都不知道。"
    pacing_note_1003: "**10/3 实测复核：用户对速率的判断成立，我此前的乐观估算作废。** ① 10/3 实测 = 3.2 队列（26' 复习含可视化工具 + 90' 做 3.2.5 单选 24 题 + 综合 4 题 + 批改）= **116'**，与 10/2 的 3.1 栈（116'）几乎一致 → **单节 ≈116' 是可重复的实测值**；② 408 实测日均：10/1 133' / 10/2 141' / 10/3 116' → **≈130'/天**（不是我 10/2 假设的 3 h/天）；③ **10/25 缺口重算**：22 天 × 130' = **≈47 h 可用**；需求 = 数据结构 ≈20h + 组原补漏 ≈12h + OS ≈20h + 网络 ≈10h = **≈62 h** → **缺口 ≈15 h，且这是「一天不崩」的下限**。**结论：10/25 的 408 一轮硬截止已破，唯一解法是砍范围（协议 G）。议题排入 10/4 周复盘第一项，由用户参与决定砍什么 —— 不在脑力透支时替他决定。**"
    round_one_definition_1003: "**一轮的目的重定义（10/3，回应「二轮碰到不还是得解决吗」）**：① 408 = 四门 150 分（数据结构 45 / 组原 45 / OS 35 / 网络 25）→ **用 30 天换数据结构满掌握、让另外 105 分一天没碰，是算术上最差的交易**；② **一轮的产出不是「学会」，是「建立索引 + 暴露弱点」**，而暴露弱点的速度：**做题 ≫ 看课**（10/3 用 116' 买到「哪 5 个考点会错、错在哪种思维上」的信息量，远大于同等时长视频）；③ **二轮成本只有一轮的 1/3** 的依据：M5/M6（11/8-11/22）就是 **408 真题分章 2009-2015**，真题直接给出考点怎么出 → 二轮是「定向补漏」，不是整章重学，且一轮已留下接触痕迹与元记忆（哪些地方当时卡过）；④ **界线（必须执行）**：一轮必懂 = **大题主干**（树/图遍历、最短路径·拓扑排序、排序性质对比、PV 操作、CPU 数据通路、TCP 握手）；一轮可粗 = 细节定义、偏怪选择题（如 10/3 的 Q19 类）、KMP next 推导、B+ 树细节；⑤ **首个可砍项：第 4 章 串**（历年 1-2 道选择 ≈ 2-4 分，全书最小章）。"
    done_1011: "**10/11 408 = 178′（iHour 两条：10:23-12:29 125′ 数据结构 / 15:35-16:28 53′ 计网）** —— **一天推进两个模块，均产出可验收数据**：**① 数据结构 第 5 章 ✅ 全章闭环**（数据：5.5.3 哈夫曼树 本节试题精选 **23 题错 2（错 04、16）= 91.3%**；交付物：树和二叉树的应用学习 + 例题做完；照片留痕 3 张，王道 p197-198）。**② 计网 4.1 ✅**（网络层概述 / 路由器互连异构网络 / 数据交换方式 / **虚电路 vs 数据报** / SDN；本节试题精选 **21 题错 3（错 03、09、13）= 85.7%**；计时 53′；照片留痕 2 张，王道 p133-134）。**错因画像（跨科目，本阶段最重要的单条发现）**：**10/6 起连续 4 个学习日、跨数据结构与计网两个科目、共 8 道错题全部落在同一族『约束/边界没抠死』** —— 10/6（5 题定义边界）→ 10/10（连中两次漏 +1）→ 10/11 上午（04 把『字符最多』读成『树最瘦』= 加约束；16 漏验『分支结点权值 = 两孩子之和』= 减约束）→ 10/11 下午（计网 03 把『互联网都跑 IPv4』的常见做法当成强制约束 = 加约束；09 **问『错误的是』却按『正确的』选 = 判反（R 类）**；13 只想到 SVC、漏掉 **PVC 永久虚电路** = 减约束）。**判据：正确率 85-91% 说明知识在，丢的分几乎全在审题与边界这个动作上** → 动作不是重修，是把这个动作流程化（10/12 起观察：若再出现一次 R 类，升级为独立『审题流程』问题）。**三道计网错题用户全部自行完成诊断 + 盲点提炼（IPv4/IPv6 互连、PVC/SVC、故障重建电路）** → 按宪法第 6 条免做条件，**只登记不抽查**，已入 `mistakes/mistakes.md`（回炉日 10/12，与结构 5.4.4 的 08、16 合并，共 5 题一次过完）。**判定：408 投入 178′ ≈ 保底 180′，交付物双模块可验收 → 达标 ✅**。"
    done_1010: "**10/10 408 = 78'（iHour 单条 19:31-20:50 = 1h18m）**：**数据结构 5.4 树与森林 学习完毕 + 5.4.4 本节试题精选 21 题刷完批改完 + 错题总结完毕**。**正确率 19/21 = 90.5%，错 08、16** —— **两道错题同构**：均为「树/森林转二叉树后右指针域（无右孩子）为空的结点数」，**均漏掉「+1」（森林最后一棵树的根 / 单棵树的根）**；08 误 B(n) 正确 **C(n+1)**；16（2011 统考真题）误 C(1895) 正确 **D(1896 = 1895+1)**。**用户自行完成同构识别 + 特值法验证（n=0 → 答案 1）+ 公式提炼（右指针为空数 = n+1）** → 按宪法第 6 条免做条件（独立完成习题 + 已报正确率与错题号）→ **只登记不抽查**，已入 `mistakes/mistakes.md`，回炉日期 **10/11**（动作仅一件：遮答案重做 08、16）。**正确率趋势**：10/6 的 5.2.3 = 30 题错 3（90%）→ 今日 5.4.4 = 21 题错 2（90.5%）→ **连续两节稳定 90% 档**，错因画像均为「定义/边界没抠死」。**按 `judgement_rule_1009` 交付物口径 → 408 今日达标**（分钟数 78' 差降级档 120' 共 42'）。"
    done: "10/2：3.1 栈 + 3.1.4 单项选择 31 题（错 4，87.1%），含 2013/2020/2022 三道统考真题（29/30/31 **全对**）；Q13 自行推导 Catalan 数 C(2n,n)/(n+1) 求 3 元素出栈序列种数，方法对；**综合应用题 01-05 未做、手写算法题今日仍为 0（硬性额度）**；计时 10:09-10:42 + 10:46-12:10 = **116 min**（10/1：第2章 2.2 习题 13 题全对；2.3 习题 36 题错 6）"
