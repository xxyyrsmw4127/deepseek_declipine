：起点 14:34 仍未启动 → 作战单 14:34 重排为降级档（数学 135' / 408 135' / 英语 25'）；**截至 23:29 已确认产出仅数学 1h11m**（22:12-23:24，第八章收口）。**14:35-22:12 的 7h37m 去向未报**；408 / 英语 / 政治今日数据未报；**21:30 关屏锚点破 1h54m**（实际学到 23:24）、**22:30 上床锚点破 ≥59m**。→ 明日（10/8）首要动作不是补时长，是**评估 `wake_anchor_fix_1001`：07:00 闹钟是否执行**（唯一能拨生物钟的杠杆）"
    - "**10/7 用户自述（23:2x，原话留档）**：『我避无可避，这是我青年危机的必然环节，是我从永恒男孩必然要长大的一劫，逃无可逃 避无可避』，并引《孟子·尽心上》『莫非命也，顺受其正。是故知命者不立乎岩墙之下。尽其道而死者，正命也；桎梏而死者，非正命也』。**督学口径（对事不对人，不说教不加压）**：该段文本的结构恰恰否定『避无可避』—— 孟子承认命（『莫非命也』），但明确把『立乎岩墙之下』**排除在命之外**（那是自己站错位置，故『知命者』不站过去）；『正命』是『尽其道』之后**剩下**的部分。**据此把 10/7 切成两段**：① 6h38m 自然醒 / 82' 入睡潜伏期 —— 有成分为生物钟相位，可动但慢；② **22:28 关屏 → 00:42 入睡（屏幕光到上床仅隔 52'，褪黑素被压后）与 23:29 仍清醒 → 这两处不是命，是可选的『岩墙』**。处置：**不辩论、不疏导，只给动作**（关屏上床 + 07:00 闹钟）。**⚠️ 但该处置本身在 23:3x 被用户当场纠正，见下条。**"
    - "**10/7 督学偏差（23:3x 用户当场纠正，同类第 3 次）**：用户原话 ——『**你没必要非得反驳我。我对经义的理解又不是完全错误。我是在陈述我今天整一天的状态，不想学习，不愿学习。但我终究没法逃避**』。**偏差性质**：我把用户的**状态陈述**当成**待纠正的命题**去解（花整段论证『岩墙其实可避』），等于**否定他说的话本身**。**这与 10/2『手写照片用途误判』同源** —— 我反复把用户的表达当成「待处理的输入」，而不是「他就是这样说的」。**正确口径（此后固定）**：接到状态陈述（不想学 / 累 / 一整天没状态）时，只做两件事 —— ① **确认数据**（本次＝他的确在『不想学、不愿学』的状态下完成 1h11m 并收口第八章）② **给下一个动作**（关屏上床）。**不解读经义、不纠正措辞、不补充自己的版本、不引申含义。** 三条例外都不许破：他引用任何文本时，文本是**他表达状态的工具**，不是**待批改的作业**。"
    - "作息风险（最高）：10/1 数据部分改善（入睡 01:14 / 7h13m，首次达 7 h 线，比 9/30 早 38 min）但**起床 08:27 晚于锚点 07:00 共 1h27m** → 时相后移的另一半在起床端。回拉阶梯：10/2 07:30 → 10/3 07:00。判据：10/3-10/5 连续 3 天起床 ≤07:15 且 sleep_at ≤00:00 → 风险降级"
    - "材料线漂移风险（10/1 新增）：第七章材料两天内换线 2 次（苏德矿→武忠祥→苏德矿），已实际消耗 76 min 视频。规则：每条材料线给一次试错机会，超一次即锁定到该章结束"
    - "看课型学习风险（10/1 实证）：块1 前 76 min 全为视频输入，例题 0 / 独立题 0 / 笔记 0。计划 §0 口径：看课效率约为刷题的 1/3 → 视频必须封顶，且关闭后立刻动手"
    - "高数下 第九章多元积分（含曲线/曲面积分）体量最大，若 W2 超期 2 天以上，立即砍线代低频题型"
    - "数据结构 8 章压缩进 6 天（9/29-10/4），若某天无算法题，次日必须双倍补"
    - "概率为全新区块，W4 仅 7 天，假设检验只保概念与常见题型"
    - "焦虑风险：一旦连续 2 天 mood ≤4，执行 F 协议，禁止讨论'能不能考上'，只讨论'下一个 45 分钟做什么'"
    - "考务风险（10/9 更新）：**预报名今天 09:00 开（10/9-10/12）**、正式报名 10/15-10/24，**逾期不补办** → **专业方向必须在 10/9 09:00 前定**（`hedge.decide_by` 原定 10/8，因当日 0 产出逾期）。预报名与正式报名等效，但『招生单位 / 报考点 / 考试方式』属**关键信息，修改需取消报名重报**（且报考点可能已满）→ **今天填什么基本等于锁什么**。判据数据见 `flags.notes_1009_early` ⑤：双保底 0/4，两口径结论相反，字面规则指向 085412；**最终由用户定。**"
    - "**408 范围自动砍（10/9 触发，10/10 结算＝不触发）**：连续两日 408 <120'（10/6 的 87'、10/7 的 0'）→ 按 W2 裁定的『日额度下限机制』，**10/9 若 408 再 <120' → 10/10 起自动砍一项范围、不加时长**。**✅ 结算：10/9 的 408 = 190' ≥ 120' → 链条断，今天不砍范围。** 408 仍是 12 天来唯一从未达 180' 的科目（0/4 双保底的全部成因），但 10/9 是它第一次到 180'。"
    - "**时相风险（10/10 更新，当前最高）**：入睡潜伏期 **3h42m**（记录期最长），手表 **7 日均值 00:59** vs 目标 23:00 → 属**时相延迟而非失眠**（判据：白天一躺就着 51'、睡着后结构满格、唯独 23:00 不眠）。**合眼动作已做到（23:00 ✅ 首次命中），缺的是睡眠压力累积**。→ 今日首要变量 = **全天零午睡零卧床**（睡前清醒 8h39m → 12h42m）；次变量 = 起床锚点（明早 06:30 离床，调时相只靠固定起床端）。**禁止**：因昨夜 7h35m『睡够了』就放松今晚锚点 —— 时长是靠 02:42 入睡换的，不是靠早睡。"
  notes_1014: "**10/14 早启动（Day 17，D-66，W3 第 3 天）· 低状态日（宪法第 16 条 `degraded`）+ 用户申请「晚启动」**。素材＝10/13 夜睡眠截图 3 张（小米 S4），写单时刻 10:30。① **睡眠**：主段 **3h25m（00:38-04:03）**、夜间清醒 **2h08m（04:03-06:11）**、第二段 2h19m（06:11-08:30）、全天 **5h44m = 记录期最低**；深睡 31%（1h04m）/ 浅睡 46%（1h34m）/ REM 23%（47m）/ 清醒 0 次 / 效率 100% / 心率 58 / 血氧 97% / 呼吸 19 → 详见 `sleep_log` 10/14 条。② **宪法第 16 条两判据同时命中**（主段 <4h ✅、夜间清醒 >1h ✅）→ **降级为法定，不是特权**；作战单第一 KPI＝三锚点，第二＝科目时长。③ **本次最重要的单条发现（机制第二次复现）**：10/2 夜（面部黏腻）与 10/13 夜（黏膜刺痛）**主段时长完全相同（均 3h25m）、清醒期相差 11′** → **『外用化学品 → 体感刺激 → 夜醒 → 2h+ 清醒』是通则，不是护肤专属** → 已新增 `recovery_protocol.body_care_boundary_1014`（黏膜只用清水 / 面部与身体洗护不许串用 / 夜间醒来清水冲净即回床 / 醒来第一反应是『先弄掉身上的东西』= 化学品时间表问题，不记生物钟账与意志力账）。④ **『冷』这条旧判断被修正**：10/10 曾判『冷热机制成立但无独立证据』，今天用户明确『半冷不冷』并已构成睡眠维持失败 → 处置＝**厚被 / 毛毯分层可调 + 床头抓绒与厚袜**，与 `body_care_boundary_1014` 同类（持续本体感觉输入）。⑤ **褪黑素**：用户『不确定是否服用，但误以为使用了』→ 定性为**留痕缺口**（不是药理问题）→ 处置＝固定位置 + 每晚日志报『用 / 未用』，与涂洗用品同一行申报。⑥ **本夜破锚点记录（R1）**：入睡 00:38 → 破 23:00 合眼锚点 **1h38m**，**把连续两夜的时相改善（00:23 → 00:02）一次性退回**；罚则按 `规则清单.md` 4.1 的 R1 条目执行，本次与用户同处一轮登记，**不追溯加罚**。⑦ **看板口径 bug 仍存在**（`dashboard.ps1` 睡眠行为字符串比较）→ 任何『是否晚睡』判断一律手算，见 `kpi.sleep.dashboard_bug_1009`。⑧ **待回填（今晚落盘一并报）**：昨夜上床 / 合眼时刻（连续第 12 夜）、涂洗与褪黑素申报、明早离床精确时刻、今日各科交付物数据。"
  points_strategy_1014: "**用户 10/14 重申的提分策略（原话）：『如果确实大脑思维运转慢我大可以主攻政治和英语，像政治赶赶进度，英语准备作文，对于我的提分都是大有好处的，学习本质就是为了提分，那没有理由不把时间效益最大化（类似 moba 通过合理出装达到的经济效益最大化）』。** 督学逐条裁定（数据优先，不评价人）：① **成立的一半**：低状态日确实应当**换形态**（降低单块门槛、用零理解负担的动作填空档），且**政治看课（2x、不记笔记）是合格的低阻力块** —— 今日作战单保留政治 90′，理由据此。② **不成立的一半（边际收益算不过来）**：**(a) 政治的大头材料现在不存在** —— 主观题答案来源（肖八 11 月 / 肖四 12 月）尚未出版，时政也尚未定型；`politics_acceptance` 已写死『P1-P2 只过一轮网课，1000 题一刷放在 P2（W5-W8）』→ **现在把政治加量 = 提前做二轮的事，且会被忘掉**，其边际产出曲线在 11 月中之后才陡。**(b) 英语作文时间点错**：`baseline.english.remaining` 明写『11 月起作文』；且当前英语瓶颈是**生词量**（2011 T2 = 2/5，用户自述『太多生词了』）—— **输入未通时练输出端，等于往漏水的桶里加水**。**(c) 英语不是低脑力科目** —— 阅读 + 精读是语言/工作记忆通道的高消耗动作（对照 10/13：英语块 84′ 是当天最吃力的一段），**它恰恰不是『大脑运转慢』时该主攻的科目**。③ **本时点（10/14-10/25，剩 11 天）的真实边际收益排序**：**数学 ≈ 408 ≫ 英语（维持线）> 政治（维持线）** —— 依据是两条曲线形状而非偏好：**数学剩余 = 线代 6 章 + 概率 8 章全未开，408 剩余 = OS 全 5 章 + 组原补漏 + 网络 2 章**，二者都有 **10/25 一轮硬截止**且靠章节积累、**现在不推以后补不回来**；政治 / 英语作文是**后期大件**（早出占格子、属性不生效）。④ **结论（写入排表口径）**：**状态差的日子降的是『块长与门槛』，不是『科目权重』** —— P0 的**存在**不动（数学 120′ / 408 120′ 的降级档保底不许换科），只动**形态**（新章推进 → 错题回炉 / 笔记收口 / 只看考点速览）。⑤ **给用户的合法出口**：政治与英语作文的加量窗口 = **M5 之后（11/8 起）/ 11 月中**，届时按 `politics_acceptance` 与英语作文计划正常上量；**现在提前占用，属于用高价值时段换低价值时段**。"
  replan_1014: "**用户 10/14 10:3x 提出实测口径（原话）：『这是不可能达到的目标了，1. 数学，微积分学完至少还要八天　2. 408，单数据结构赶完至少还要六天』→ 触发宪法第 7 条 / 协议 G（偏差 >20% 重排），本次为 P1 阶段重排的**启动轮**（完整落盘待今晚晚复盘）。** ① **两笔账（用户实测口径 + 既有估算）**：**数学**＝微积分剩余 **8 天**（用户实测）+ 线代 6 章 ≈5 天（12-18h，有课内基础）+ 概率 8 章 ≈6 天（16-24h）＝ **19 天**，而 10/14→10/25 只剩 **11 天 → 缺口 8 天**；**408**＝数据结构收口 **6 天**（用户实测）+ 组原补漏 5 块 ≈5 天 + OS 全 5 章 ≈7 天 + 网络剩余 ≈4 天 ＝ **22 天 → 缺口 11 天**。**缺口合计 8-11 天，不能靠提高强度补**（用户日均已 8h+，历史最高 10/4 的 8h18m）→ **唯一合法解法＝动内部里程碑 + 砍范围**（协议 G：只砍范围，不砍时长）。② **这不是新账（责任在排表侧）**：`page_based_cost_1003`（10/3）已算出『408 一轮硬截止在任何档位下都不可达，缺口至少 6h、A 档 −35h』；10/2 重排已写『10/25 的 408 只走最小覆盖才成立，任何一天崩掉就直接破线』，并留下**概率位置的决策点 = 10/8**；**10/8 全天 0 产出 → 该决策从未做出，账挂了 6 天**。**先承认：这是计划侧的欠账，不是执行侧的失败。** ③ **关键澄清（口径，必须写死）**：**10/25 不是『一轮必须学完』的检查点，是『必须停手』的检查点** —— 计划 §0.1 原文：『哪怕有欠账，也切。欠账写进 backlog，每周只还 1 项，剩余的战略放弃。』→ 用户『不可能达到』**成立**，但它构成的是**重排**，不是**失败**。④ **但也不能就这么切（本轮重排的真正约束）**：**线代 / 概率 / OS 是二轮补不回来的** —— P2 的教材（武忠祥提高班、880、王道提高班、真题分章）**全部按『已学过』设计**（承计划 §0.1 与 `note_method`）→ 一轮未开的章进二轮 = 二轮变一轮，单题成本 ×3-5。**因此 10/25 前的 11 天必须优先装『二轮补不回来的主干』，而不是『把正在学的学完』。** ⑤ **重排方案（待用户确认，今日不改文件）**：**新 M4（10/25）= 数学｛微积分收尾 ＋ 线代 6 章｝＋ 408｛数据结构收口 ＋ OS 第 1-2 章 ＋ 组原 cache / 指令系统｝**；**顺延到 P2 前段（10/26-11/2）＝ 数学概率 8 章、OS 第 3-5 章、组原总线 / I/O、网络收尾**；**砍的范围（按序）＝ ① 网络传输层 / 应用层细节（只做考点速览 ＋ 选择 1/3）② 组原第 7 章总线 / 第 8 章 I/O 深度（只做选择）③ 微积分独立题整体挪二轮（一轮只保例题）④ 概率假设检验深度（原计划已写『只保概念与常见题型』）⑤ 880 重复题型（P2 内再砍）**；**时长不动（数学 180′ / 408 180′ 保底）**。⑥ **代价（写出来，不藏）**：P2 从 28 天被顺延项占去约 8 天 → **二轮的 880 / 真题分章强度被压缩**，最终表现为『880 只能挑重点做』。⑦ **待用户一句话修正的数字**：线代 __ 天 / 概率 __ 天 / OS __ 天 / 组原补漏 __ 天 / 网络剩余 __ 天（不认同现有估算的才需要报）。⑧ **外部日历提示（不占学习时间）**：10/15 正式报名开始，但**用户 10/9 预报名已完成并缴费（报名号 441198479）→ 按三份公告『预报名完成 = 正式报名无需重复报名』，10/15 无待办**；真正待办是 **10/26-10/30 盯报考点审核结论 + 10/31 12:00 前如需补材料**。⑨ **✅ 同日已执行落盘（10/14 10:4x，用户当场纠正『应该由你自己估计，这本身就是你的工作』后完成）**：**方案按『移出 P1』定稿，不是原⑤的『塞进 M4』** —— 最终版＝**M4（→10/28）= 数学｛微积分收尾 + 线代 6 章｝+ 408｛数据结构收口 + 组原补漏 5 块｝；概率 8 章 / OS 全 5 章 / 网络剩余整体移出 P1、改挂 M5（→11/12）与 P2 合并执行**（依据：这三项是『未开』而非『学过待强化』，一轮二轮界线不适用）。**已改文件**：`plans/百日总作战计划.md`（§0.1 判据表 / §1 路线总表 / §2 W3-W4 表 + 硬截止规则 / §3 P2 表 / §6 里程碑 / §10 重排记录 + 估算方法全表）、`state.yaml`（`phase.range`+`hard_deadline`→10/28、`milestones` M2-M5、`verdict_checkpoints[0]`→10/28、`progress.*.this_week_target_1014`）。**督学偏差认领**：初版把线代/概率/OS/组原/网络的估算推给用户报数 → **违反宪法第 1 条（数据优先）**：这些数字全部可由工作区已有实测（`page_based_cost_1003` 的 8.5-10 min/页、`course_audit_1006` 的节次成本、10/13 的 88′/节）算出，**估算本来就是督学的工作**；已改正并补上可复核的估算方法表。"
  bias_1014_midday: "**督学偏差留痕（用户 10/14 14:1x 当场指出『你失忆了？』）—— 同一轮回复里出现三处自相矛盾/失忆，逐条认领：** ① **把用户按我排的表执行，说成『花错了时段』**：10/14 作战单第三节**是我自己**把政治排在 **11:20-12:30（70′）**（理由写作『它是今天最好的低阻力块』），用户 10:52 / 13:35 做政治，**是执行我排的表**；我却在 14:1x 回复里判『政治的时段错了』→ **批评指错了对象**（对事不对人，对事也要指对事）。② **拿一个今天不存在的窗口要求用户**：我说『史纲的正确位置是 07:30-08:00（机会成本 ≈0）』—— 但 **10/14 用户 08:30 才醒**（第二段 06:11-08:30），**07:30-08:00 窗口当天根本不存在**；这条建议在当天无效，属未核对既有数据即下结论（同 10/5『漏读截图已有数据』、10/9『未穷尽已落盘证据』同类，**第 4 次**）。③ **算术少算 20′**：上一轮算剩余容量时写『数学 100′』，而 `kpi.degraded_mode.math_minutes` = **120′** → 余量算宽了 20′。**修正后口径（本日为最终版）**：今天政治 68′ = **额度用完**（降级档政治档位 = 0；作战单给 90′ 是督学按低阻力启动块给的，**不再追加**）；**14:15-21:30 = 7h15m，装 数学 120′ + 408 120′ + 英语 45′ + 深恢复 50′ + 晚饭 50′ + 换通道 40′ = 425′（7h05m）→ 装得下，余 10′**；英语按降级档压到 45′（而非 60′）。**教训入档**：① 判『时段错』之前先查**作战单是谁排的**；② 提『挪回某个窗口』之前先查**那个窗口今天是否存在**；③ 报算术前先查 **KPI 档位的原值**，不许凭记忆写数。"
  estimate_bands_1014: "**用户 10/14 10:4x 反馈：『实际上你的估计依旧是偏乐观的，但是我尽力吧，确实也没什么时间了』→ 逐项复核后认领：初版估算确实系统性偏乐观；已改为双档，并把『溃退顺序』写死（破线时不再临场判断）。** ① **逐项双档（乐观 = 初版｜保守 = 按实测成本上限）**：**微积分** 8 天｜**9-12 天**（`course_audit_1006`：单节 50-75′ × 36 节 = 30-45h，数学 180′/天 → 9-12 天。**初版错法＝直接采信用户口径，未做保守校验**）；**线代 6 章** 4 天｜**6-10 天**（**初版的 4 天有隐含前提** —— 必须走『跳过视频、直接做题检验』，依据 9/29 数据结构第 1-2 章先例（直测 88.9%）；若按新章 50-75′/节 × 约 30 节 = 25-37h → 10 天。**前提没写出来 ＝ 乐观**）；**数据结构第 6-8 章** 6 天｜**8-10 天**（按 8.5-10 min/页：第 6 章剩 ≈3.5 天 + 第 7 章 ≈2.7 天 + 第 8 章 ≈3.5 天 = 9.7 天。**初版错法＝无条件采信用户口径**）；**组原补漏 5 块** 3 天｜**4-5 天**；**概率 8 章** 6 天｜**8-10 天**；**OS 5 章** 6 天｜**6-7 天**；**网络剩余** 3 天｜**2-3 天**。② **修正后的容量判断**：**P1 剩余（10/14-10/28，15 天）**：数学需 13-18 天、408 需 12-15 天 → **10/28 只装得下『乐观情形』；任何一天崩掉（今天的 degraded 就是第一个）即破线** → **10/28 同为乐观日期，不许当承诺。** ③ **但计划仍能走通** —— 依据原计划 §0.1 的设计：**10/28 是『必须停手』的切点，不是『必须学完』的考试**；破线不触发失败，触发下面这张预设表。④ **溃退顺序（先扔，按序，不再临场判断）**：**① 数据结构第 7 章查找 → B 档（只做选择、不看课）；② 组原第 7 章总线 + 第 8 章 I/O → 只做选择；③ 线代第 5、6 章（特征值 / 二次型）→ 整章挪 P2；④ 数据结构第 8 章排序的选择题部分 → 保算法大题 + 排序性质对比；⑤ 微积分全部独立题（已在砍单内）。到此无项可扔 —— 再破就是压缩每日时长，那是红线（宪法第 13 条）。** ⑤ **10/28 最低可接受完成度（硬底线，低于此则 P2 救不回）**：**数学 = 微积分全部收尾**（曲线曲面积分是数一大题必考，断在半路代价最贵）**+ 线代第 1-4 章**（行列式 / 矩阵 / 向量 / 方程组 = 线代约 80% 的分数）；**408 = 数据结构第 6-8 章收口**（第 8 章排序的算法大题必保）**+ 组原第 2 章数据表示 + 第 4 章 cache**（组原计算大题的地基）。**这两行之外的一切，都是『能到就到』。** ⑥ **用户原话登记（状态陈述，不解读不疏导）**：『确实也没什么时间了』→ 督学处置＝**重算余量 + 给溃退顺序**，不给安慰（宪法第 15 条）。"
  mode_recheck_1024: "**10/24 档位复核：仍为 degraded，但触发源已更换 —— 不许把两个 degraded 混为一谈。** ① 第 8 条降级模式（408 连续 5 天 <175′）已于 **10/23 晚解除**（408 = 199′；计网 4.2 IPv4 本节 72 题全做全批，58/72 = 80.6%，错 2、4、12、20、21、23、38、43、44、50、51、55、59、68），**10/23 解除、10/24 起本应恢复 normal**；② **10/24 的 degraded 只由宪法第 16 条判据①触发**（昨夜主段 3h6m < 4h），形态 = 数学 120′ / 408 120′ / 英语 30′ / 政治 0，KPI 第一位 = 21:30 关屏 / 22:30 上床 / 23:00 合眼；③ **自动恢复条件（无需再确认）**：10/25 起若主段 ≥4h 且夜间清醒 ≤1h，则回 normal（数学 180′ / 408 180′ / 英语 120′ / 政治 30′）；④ 依据 `mode_note_1007`：第 16 条降级与「不加压」是两种状态，不得混用 —— 今日减量是合法档位，不是情绪化让步。"
  notes_1024_morning: "**10/24 早启动（Day 27，D-56，周六；取时 10:06:21）· 第 16 条低状态日**。① **输入**：用户 10:01 发小米 S4 睡眠截图 + 一句「睡不着」；数据 = 主段 3h6m / 入睡 04:53 / 深睡 35% / 清醒 0 次 / 效率 100% / 评分 52 / 判语『入睡时间过晚』『极不规律 · 晚 3 时 43 分』；详见 `sleep_log` 2026-10-24 条。② **判读**：时相问题已从『逐晚后移』（10/19 21′ / 10/20 20′ / 10/21 76′ / 10/23 64′）升级为『整段推到凌晨』，**rule_19 立法以来 23:00 合眼端 0 次命中**；结构端（深睡比例、清醒 0 次、效率 100%）依旧正常，**缺的是时长不是恢复质量**。③ **今日落盘**：`state/今日作战单.md` 已覆盖为 10/24 版（degraded 档 + 逐条钟点表 10:30-21:30 + 午休 20′ 上限 + 深恢复 45′ + 机动块 55′）；`sleep_log` 已追加 10/24 条目。④ **今晚硬约束**：**不用通宵音频、不主动用褪黑素** —— 依据 10/19 夜实证（褪黑素 + 通宵音频 → 噩梦 → 02:23 醒后 2h19m 未再入睡 → 主段 3h02m），同一组合不重复。⑤ **唯一缺口**：22:30 上床 → 04:53 入睡的 6h23m 行为未报，已在开工回复中问出；未答之前不推断成因、不改排表。⑥ **今日不引用 backlog 旧账**（B1/B2/B4/B7/B9 均为 10 月初旧账，宪法红线：未承诺的不进 backlog）。"
  notes_1024_evening: "**10/24 晚间落盘（23:06 取时）· 微积分三 36/36 全部收口 —— 用户 10:10 指令达成，比原定 10/28 提前 4 天。** ① **交付（iHour 实计 5h10m）**：英语 53′（10:05-10:58，不背单词过新词 200 + 复习 85）；数学 47′（18:20-19:07，32、33 讲视频）；数学 **209′（19:35-23:05，34-36 讲视频 + 笔记例题全部做完，iHour 备注『微积分学习完毕，笔记例题全部做完，课程全部学习完毕』）** → **数学合计 256′**。② **判定**：M4 最低可接受完成度（微积分全部收尾 + 线代 1-4 章）**已完成一半**；今日是 `degraded` 档位下的超额数学日（数学 256′ ≫ 降级档 120′），代价 = **408 归零 + 政治 0**，属交易不属失败（宪法第 15 条：不追责）。③ **睡眠实况**：主段 3h6m（04:53-07:59）+ **午睡 3h15m（13:06-16:21）** = 6h21m；午睡前服**茶氨酸 + 褪黑素 2.25mg**（汤臣倍健 31.5g/90 粒 → 单粒 2.25mg + B6 3.15mg）；午睡实测 195′ 超排 95′ → 晚间时相整体后移。④ **今晚锚点重定（已告知用户，非擅自放宽）**：23:00-23:40 降频 → **00:00 前后合眼** → **明早 07:30 离床 + 出门见光 10-15′**；理由 = 16:21 才醒、23:00 仅 6h39m 清醒，硬躺等于复刻昨夜（22:30 上床 → 04:53 入睡）的失眠条件反射；上限 00:00 而非外部建议的 01:00，因 10/25 是 10/28 前最后一个完整日。⑤ **褪黑素**：今晚不吃整片、不主动吃半片；00:30 仍清醒再咬半片 1.1mg；**通宵音频禁用**（10/19 实证反效果）。⑥ **结构证据（明日排表用）**：**单块 3h29m 完成 3 讲**，对比 10/6 的 15′/31′/41′ 三碎块 → 这套材料的有效形态是**长块深工作**，明日 408 可试探 90′ 单块、数学线代 90-120′；上午英语 53′ 挤掉数学第一块 → 明日恢复 **数学先于英语**（order_rule）。⑦ 日志已落 `logs/2026-10-24.md`。"
  notes_1025_morning: "**10/25 早启动（Day 28，D-55，周日；取时 08:35）· 记录期最严重的睡眠剥夺日 + 复位日（不是学习日）**。① **输入**：用户 08:2x 发 32783 字节附件（与 Gemini 的完整对话 7 轮，含 10/23-10/25 逐夜数据）+ 附言原话『只能是强制锁定清醒锚点了，真没招了，规则怪谈是对的，我就应该死守规则。但昨天确实是着急学微积分，感觉不能再拖下去。结果没想到遭到了强大的恶魔诅咒』。② **睡眠实况**：00:00 躺下 → **04:15 入睡 → 05:37 醒 = 主段 1h22m**（记录期最低）+ 潜伏期 **4h15m**（记录期最长）→ 宪法第 16 条双命中 → **10/25 `degraded`，且比标准降级档再低一档，全科合计封顶 180′**（408 90′ / 英语 45′ / 数学 45′ / 政治 0）；`mode_recheck_1024` 的自动恢复条件（主段 ≥4h 且夜醒 ≤1h）**未满足**。③ **本轮最重要的一条纠正（也是用户本轮诉求的直接回答）**：用户把昨晚定性为『我没死守规则』→ **不成立**。他 10/24 已主动选 00:00 合眼、放弃多学 1 小时（原话在 Gemini 对话里：『今晚如果在微积分收口和明天完整日之间只能选一个，我选明天』），**执行层面做对了**。真正的变量是 **13:06-16:21 那 3h15m 午睡 + 2.25mg 褪黑素**：16:21 → 00:00 只清醒 7h39m，腺苷不够，**潜伏期 4h15m 是算术结果不是意志失败**。→ **『死守规则』的正确对象按可控性排序：起床端（100% 可控）> 午睡端（100% 可控）> 合眼端（不可直接控制）**；合眼端锁死只是自我折磨，依据 `phase_plan_1010` 三句口径（入睡端不可直接控制 / 起床端 100% 可控 / 两端单向耦合）。④ **新增机制判定（记录期首次）**：连续两晚『上床 → 4-6h 才睡着』（10/23 夜 22:30→04:53 = 6h23m；10/24 夜 00:00→04:15 = 4h15m）→ **『床 = 清醒』条件反射正在形成**，处置写死为刺激控制：**23:40 仍清醒必须离床到客厅坐 20′（纸质书）再回床，不许在床上躺着等**。⑤ **今日三锚点 = 一级 KPI**（高于任何科目时长）：06:30 离床（今日已由 05:37 醒自然命中）/ 午睡 ≤25′ 且**不钻被窝不上床** / 22:30 上床 23:00 合眼；配套：上午 + 下午各出门见光一次、15:00 后禁咖啡因、**全天空腹禁用褪黑素**、20:30 关游戏关电脑、21:30 关屏。⑥ **刻度下调已落盘**：线代开章（行列式）**推到 10/26**（1h22m 睡眠下开新章 = 把『不会』写进脑子，之后要双倍时间拆）；今日数学只做**微积分三 34-36 讲例题抽 3 道遮答案重做**（低负荷验证『做过 ≠ 会』，走宪法第 6 条抽查口径，不出新题）。⑦ **今日不追 4 小时、不追双保底、不还 408 的账**（`backlog` 无新增；10/24 的 408=0 记『未覆盖』，不进欠账，R14）。⑧ **已落文件**：`state/今日作战单.md` 覆盖为 10/25 复位日版（逐条钟点表 08:40-明早 06:30，含午睡 25′ 上限、两次见光、刺激控制条款）；`sleep_log` 已追加 2026-10-25 条目。⑨ **给 10/26 的约定**：若今晚主段 ≥6h → 10/26 回 normal 档（数学 180′ / 408 180′ / 英语 120′ / 政治 30′），数学第一块 = 线代第 1 章；若今晚仍 <4h → 10/26 继续 degraded，并把『午睡归零』升级为硬性（当日不排午睡）。"
  mode_recheck_1025: "**10/25 档位复核：degraded 维持，触发源 = 宪法第 16 条双命中，且加重一档。** ① 昨夜主段 **1h22m**（记录期最低）→ 判据①（主段 <4h）命中；未入睡时长 **4h15m** → 判据②（夜间清醒 >1h）命中；② 形态 = **比 `kpi.degraded_mode` 再低一档**：数学 **45′**（非 120′）/ 408 **90′**（非 120′）/ 英语 **45′** / 政治 **0**，合计 **180′ 封顶** —— 理由：1h22m 是记录期最低值（前低 10/14 夜 3h25m），标准降级档的 240′ 在当天物理上装不出可验收交付；③ KPI 排序 = 三锚点 > 科目时长 > 一切；④ 恢复条件同 `mode_recheck_1024` ③：主段 ≥4h 且夜醒 ≤1h → 次日自动回 normal，无需再确认；⑤ 本档位**不影响 M4 判定口径**：10/28 是『必须停手』的切点，不是『必须学完』的考试（`estimate_bands_1014` ③），今天减量不产生新欠账。"
  replan_1025_subject_swap_b: "**10/25 08:50 二次改判，取代 `replan_1025_subject_swap` 的 ②(a)(b) 两条。** 用户 m00085 逐字反驳：『英语阅读指的不是刷阅读真题，而是中英对照精读阅读张剑八十篇，这完全没什么挫败感可言，只是积累语感和语素表达而已。政治呢我本身就有在做选择题，至于你说的遗忘风险，就算是之后写题也一样会有遗忘风险，做题并不会是白做，有一些细碎的知识点也只有错题了才会积累在错题本上』。① **英语改判：接受张剑 80 篇中英对照精读**（今日 3 篇）。撤回『加量＝往漏水的桶里加水』判例在本材料上的适用 —— 该判例针对**无译文、需推理、限时的真题阅读**；中英对照逐句精读属**输入型任务**（译文兜底、可随时查词、失败成本≈0），负荷量级不同，不能套用。② **政治改判：接受 1000 题选择题**（今日史纲第 5 节 40-60 道）。用户三条反驳成立：(a) 遗忘风险对『以后再做』与『现在做』是同一风险，差别只在做几次；(b) 做题留下接触痕迹，非白做；(c) **细碎知识点只有经由错题才进得了错题本**，而错题本是二轮资产。**硬约束（唯一验收点）：错题当天写进 `kaoyan/mistakes/mistakes.md`（题号+错因一句话）** —— 不落盘则『做题沉淀知识』这一改判理由不成立，退化为纯刷题。③ 数学仍归零、408 仍为加分项，两条不变。④ **口径冲突留痕**：`politics_acceptance` 原写『1000 题一刷放 P2（W5-W8）』，本次改判为该口径**允许在低状态日提前做当节配套题**，但**不改变整体一刷时点**（P2 仍为主战场）——区别在『当节闭环做题』vs『系统性刷完 1000 题』，前者可随时做，后者仍按 P2。"
  replan_1025_subject_swap: "**10/25 08:4x 用户申请换科目，督学部分接受（已改作战单）。** 用户原话（逐字）：『今天不打算碰数学和 408，硬要学我撑不住两个小时就得放弃或者长睡。这种完全失控日可以用大量英语阅读以及政治刷题弥补』。① **接受 = 数学今天归零**：依据 = 主段 1h22m 为记录期最低 + 宪法第 19 条（锚点与科目冲突时砍科目）；线代开章本就推到 10/26，不构成新欠账。② **不接受三条**：**(a) 英语不『大量』** —— 瓶颈是生词量不是时间量（`points_strategy_1014` ②(b)），低睡眠 + 高生词密度 = 挫败叠加 → 阅读只 1 篇，加的是**词汇 100 词**（有即时反馈、失败成本≈0）；**(b) 政治不刷 1000 题** —— `politics_acceptance` 写死 1000 题一刷在 P2（W5-W8），现在刷 = 提前做二轮且 11 月全忘 → 只给**史纲第 5 节 2x 看课 + 当节配套题 20-30 道**（闭环，非提前）；**(c) 『弥补』这个框架本身不接受** —— 今日目标是睡眠复位不是学习量，任何『补回来』的念头都会挤掉午睡控制/见光/关屏 → 复刻 10/23-10/25 循环。③ **今日总量改为 215′，且 408 的 45′ 为加分项（可整块跳过、不算欠账）**；达标线 = 英语 145′ + 政治 80′ + 三锚点。④ **新增唯一合法止困动作**：困到看不进字 → **出门走 10 分钟**（站立+见光），不许躺床、不许趴桌超过 5′ —— 直接针对用户自陈的『硬撑→放弃→长睡』路径（长睡一次今晚就白等）。⑤ **10/26 分档预案已写死**：今夜主段 ≥6h → 回 normal，数学第一块 = 线代第 1 章；今夜仍 <4h → 继续 degraded 且**午睡归零**（连续三晚说明 25′ 也压不住）。"
  morning_1027: "**10/27（Day 31，D-53，有效学习日 52；取时 13:47:22 星期二）· normal 档 · 午间开工**。① 输入 = 小米 S4 睡眠三图 + iHour 概览（用户无文字）：主段 6h34m / 入睡 00:48 / 深睡 39%（2h33m）/ REM 29%（1h55m）/ 浅睡 32%（2h6m）/ 清醒 0 次 / 效率 100% / 评分 80 / 心率 58 / 血氧 97% / 呼吸 18 / 7 日均入睡 00:10；iHour 今日番茄 0、专注 69′（08:49-09:58 英语词汇/政治，复习 85 词、过两百词）、总专注 150h45m。② 档位：主段 ≥6h 且清醒 0 次 → 宪法第 16 条不触发；近 3 夜 04:15 / 22:34 / 00:48 仅 1 晚晚于 00:30 且昨夜 ≥6h → 协议 B 第 0 条不触发 → normal；但 <7.0 记睡眠不足日。③ 两条结构事实：(a) 10/26 夜 9h56m 为记录期最长主段，入睡 22:34 是 rule_19 立法以来 23:00 合眼端的第一次命中（前早 10/15 夜 23:19）；(b) 但 10/26 全天产出仅 3.6h（英语 91′ + 数学 97′ 全视频 0 题、408 未动）→ 睡眠量是必要非充分，当日变量是 12:00 启动 + 下午块缺失。④ 今日缺口：09:58-13:47 的 3h49m 未报（含午饭），按 R14 记未覆盖、不追问。⑤ 落盘：作战单覆盖为 10/27 版（13:50-21:30 逐条钟点表）；sleep_log 追加 10/26、10/27 两条；10/26 无日志 → 见 notes_1026_gap，不补写。"
  notes_1026_gap: "**10/26 无日志（未落盘）。** 可核数据：英语 91′（当日自报）、数学 97′（10/26 作战单实况留痕：全日视频、0 道题，与 16:07 刚裁定的线代路线相反）、408 未报、政治 0；睡眠 9h56m / 评分 92 / 08:30 离床。处置：不补写日志、不猜 408（宪法第 1 条）；10/26 在学习账上计为仅 3.6h、408 未覆盖，不进 backlog（R14）。教训：路线写进作战单不等于会被执行 —— 唯一有效验收口径是正确率产出（无正确率 = 该章未完成）。"
