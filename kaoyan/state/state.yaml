  rule_exec_1015: "**R1 起床端破线 1 次 + 罚则执行（10/15 判定，针对 10/14 夜→10/15 晨）**。**客观事实**：10/15 离床 **≈06:56**（截图曲线终点 07:00；用户自述晨间事务已含洗澡/洗漱/洗衣/早餐 → 离床应早于 07:00，精确值待回填），**破 06:30 锚点 ≈26′**，超判定线 ≤06:45 共 11′。**同时记录的三项改善**（处罚不掩盖事实，事实也不掩盖改善）：入睡 23:19 = 破合眼端仅 **19′**（`rule_19` 立法以来最小幅度）、主段 **7h37m ≥ 7.0 线**（连续 4 天睡眠不足日终结）、深睡 2h59m 与 REM 2h13m **双项记录期最高**。**罚则执行（按 `规则清单` 4.1 R1 破锚点任一端）**：① **明日（10/16）06:30 闹钟提前到 06:00**，且起床后 30′ 内必须出门走 15′（不接受『再躺五分钟』）；② **今日（10/15）启动块降为『裸启动』** —— 不许看任何视频/课，只许直接做题或遮答案重做错题 → **已写进今日作战单块 1（第 54/55/56 讲笔记补完 + 例题，非看课）**，且未影响主线安排（`schedule_floor` 保住午饭 / 晚饭两块）；③ 当日 KPI 第一位改为「锚点」，科目时长让位 → 今日一级 KPI = **21:30 关屏 / 22:30 上床 / 23:00 合眼**，昨夜合眼端仅差 19′，**本夜是记录期最有希望首次命中 23:00 合眼的一夜**。**累积口径**：本自然周（10/13 起，周一 00:00 清零口径下 10/12 起算）R1 违规次数 = **1 次**（10/13 夜 62′ / 10/14 夜 98′ 为『只记录不处罚』的临界夜与低状态夜，见 `规则清单` 五、违规记录表）→ 按 4.2 单次处罚照执行，不叠加。**一处待裁定**：该破线是否同时使 10/15 丧失 `rule_18` 的「作战日」资格（影响补偿日链条）→ 见 `rules_1008.rule_18_fatigue_compensation.current_count_1008.counting_open_question_1015`。"
  morning_1016: "**10/16 早启动（Day 19，D-64，W3 第 5 天）· 正常档（非 degraded、非补偿日）· 素材＝10/15 夜→10/16 晨睡眠截图 4 张（小米 S4）**。① **睡眠（详见 sleep_log 10/16 条）**：入睡 **01:03** / 醒 **08:30** / 主段 **7h27m** / 深睡 37%（2h44m）/ 浅睡 40%（3h）/ REM 23%（1h43m）/ 清醒 0 次 / 效率 100% / 评分 82（高于 75% 同龄）/ 心率 59 / 血氧 97% / 呼吸 18。② **时长侧与时相侧背向而行**：(a) 主段 7h27m ≥ 7.0 线 → **连续第 2 天达标**（10/15 夜 7h37m → 本夜 7h27m）；(b) 入睡 01:03 → 破 23:00 合眼锚点 **123′**，**把 10/15 夜「破线仅 19′」的势头一夜退回 1h44m** → `phase_plan` 中「破线幅度连续压缩、趋势成立」的结论**作废**，重回逐夜判定；(c) 起床 08:30 → 破 06:30 锚点 **120′** → **R1 两端同破**。③ **三条强制降级均不触发**：宪法第 16 条（主段 7h27m > 4h、夜间清醒 0 次 < 1h）不触发；协议 B 第 0 条（近 3 夜入睡 00:38 / 23:19 / 01:03 → 仅 1 天晚于 00:30；且 7h27m ≥ 6h）不触发 → **今日正常档：数学 180′ + 408 180′ + 英语 120′（`kpi.english_policy_1013` 生效中）+ 政治 30′**。④ **一级 KPI = 锚点**（R1 罚则③）：21:30 关屏 / 22:30 上床 / 23:00 合眼 / 明日 06:30 离床。⑤ **启动块 = 裸启动**（R1 罚则②）：今日块 1 = 408 · 6.4 图的应用 47 题（**口径更正 10/16 14:5x：实为「6.4 小节的全部选择题 47 题」** —— 用户原话『不是什么精选，我是把这一小节的所有选择题做了 … 全都做完了』；「试题精选」是 agent 从 10/4 记录误带的词，本节已穷尽、**无剩余同类题可挑**，错题回炉改为遮答案重做原题），**不许看任何视频/课**。⑥ **当日排表见 `kaoyan/state/今日作战单.md`**（写单时刻 09:16，09:20 启动）：块 1/2 = 408 180′（6.4 试题精选 47 题 3′/题时间盒收口 + 6.1 回炉 08/12 题）；块 3/4 = 数学 180′（**线代第 1 章行列式起手 + 第 2 章矩阵** —— M3 起手，此前线代未动）；块 5/6 = 英语 140′（不背单词 200 词 + 2011 Text 4 做题限时 22′ + 精读）；政治 30′（史纲第 3 节辛亥革命）；深恢复 50′（16:50-17:40 出门走 + 听歌 + 词汇音频）。⑦ **M3（10/18）风险已如实标注、未加压**：M3 = 线代 1-3 章 + 组原补漏起手；按今日+明日各 180′、本轮「只保讲义+例题」口径，两天最多推进到线代第 2 章 → **M3 将部分达线**，10/17 晚复盘按实况走协议 G 微调。⑧ **待用户裁定三项**：10/15 作战日资格口径、英语新口径是否落盘为正式配置、今日是否行使补偿日权益（agent 建议不行使）。"
  rule_exec_1016: "**R1 双端破线 1 次 + 罚则执行（10/16 判定，针对 10/15 夜→10/16 晨）**。**客观事实**：合眼端入睡 **01:03**，破 23:00 锚点 **123′**；起床端 **08:30**（截图曲线终点，离床精确时刻待报），破 06:30 锚点 **120′**；**两端同破**。**破线幅度在记录期的位置**：合眼端 123′ = 第 **3** 重（10/8 夜 270′ > 10/10 夜 222′ > **本夜 123′** > 10/14 夜 98′ > 10/12 夜 83′ > 10/13 夜 62′ > 10/9 夜 54′ > 10/15 晨 26′）；**比前夜 23:19 后退 1h44m**。**罚则执行（按 `规则清单` 4.1 R1）**：① **次日（10/16）06:30 闹钟提前到 06:00 + 起床后 30′ 内出门走 15′** → **未执行**（用户 08:30 醒，无 06:00 闹钟记录）→ **如实记账、不追溯、不叠加**；其中「出门走 15′」并入 10/16 **10:50 换通道**补做（已写入作战单）；② **次日（10/17）启动块降为『裸启动』** —— 不许看任何视频/课，只许直接做题或遮答案重做错题；③ **当日（10/16）KPI 第一位改为「锚点」**，科目时长让位。**累积口径**：本自然周（10/12 00:00 起算，10/18 24:00 清零）R1 违规 = **2 次**（10/15 晨起床端 26′ + 10/16 晨双端）→ 按 `规则清单` 4.2 **第二档：次周首日 10/19（周一）执行降级档**（数学 120′ / 408 120′ / 英语 30′ / 政治 0）；**若本周再破（10/17 或 10/18 晨）→ 升级第三档**（次周政治归零 + 英语压 1 篇阅读 + 写 flags 事故留痕）。**一处待裁定**：该破线是否同时使 10/15 丧失 `rule_18` 的『作战日』资格（影响补偿日链条）→ 见 `rules_1008.rule_18_fatigue_compensation.current_count_1008.counting_open_question_1015`；agent 建议宽松口径（起床破线只记 R1，不否定当天 9.5h 的作战事实），`state.yaml` 已按宽松口径落盘。"
  scheduling_rule_1016: "**浮动晚饭条款（10/16 21:2x 用户反馈立规）** —— 触发：用户原话『搞我心态我说实话，失去吃晚饭这个锚点我休息和学习的时间就出现紊乱』（弟弟回家 → 晚饭推迟，19:31-20:42 共 71′ 漂移段；我 17:49 排的『17:49-18:30 晚饭 → 18:30 回桌开英语』整段失效）。**判定：把晚饭当固定钟点块排＝排表侧错误** —— 晚饭受家庭变量控制，不满足『自主可控』这一锚点前提（对比 21:30 关屏 / 06:30 离床：完全自主）。**修正四条**：（1）晚饭**只给开始时间、不给结束时间**，排为『可截断块』（饭来了即停，不追进度）；（2）晚饭前最后一块与晚饭后第一块**各自独立成块**，块序**不跨晚饭继承** —— 晚饭漂移只影响它自己，不推倒后续；（3）**全表只锚死两个硬点：当日 21:30 关屏、次日 06:30 离床**，其余块一律『有开始时刻、无锁定结束时刻』；（4）**执行证据（10/16 实测）**：用户自发把饭前 18:50-19:31（40′）与饭后 20:42-21:25（42′）各做成独立块，**晚饭推迟 71′ 却一块未丢** ⇒ 本条款是把用户已做对的动作写死，不是新增负担。**待办**：下次协议 G 重排时并入 `kaoyan/state/规则清单.md` 正式条款序号（R14）。"
  notes_1017_mid: "**10/17 中检（09:56 取时；素材＝iHour 概览 + 手写笔记照片 2 张）**。① **iHour 实测**：7:50-8:32 = 41′ 英语词汇（不背单词 200 词 + 复习 16 词）/ 8:35-9:42 = 1h07m 数学（13、14 课笔记例题补全）/ 9:45-9:54 = 9′ 数学（笔记进一步补全）→ **今日累计 1h57m（数学 76′ / 英语 41′）**；番茄数 0 —— **手动计时，不构成违规**（承宪法第 20 条⑥：切块责任在排表、执行靠用户自己的计时工具，agent 不介入过程）。② **块 1 交付物已闭环 ✅**：**微积分三第 13、14 讲笔记 + 例题补全 = 10/15 起两天挂的头号悬账已清**（手写 2 页留痕；按宪法红线**只记留痕、不判对错**）：含转动惯量 I_z = ∬(x²+y²)ρ dV 的球坐标与柱坐标两套算法、引力三分量 F_x/F_y/F_z 的对称性消零与三层积分（先 z 后 θ 再 r）、第二类曲线积分的定义 ∫_AB P dx + Q dy = ∫_AB (F·τ) ds 与五条性质、坐标式化为定积分。③ **块序与排表互换（英语在前、数学在后）→ 记合规、不记偏差**：7:50 先做词汇属**低负载启动**（R2「每天一次启动允许最小」的合法形态），且**裸启动要求未被破坏**（全程无视频/课）→ 与 `order_rule`（数学先于英语）的冲突按『先启动、再主线』处理，不追溯。④ **数学内容前置**：笔记已含**第二类曲线积分的定义与性质**（原排 09:50 起）→ 块 2 重心改为**计算方法**（化为定积分 / 两类曲线积分的关系），定义段跳过，省 10-15′。⑤ **进度对照（截至 09:56）**：排表应到 = 数学 90′（08:00-09:30）；实际 = 数学 76′ + 英语 41′ = **117′，总时长超前 27′**，唯一缺口是数学块差 14′（笔记已补完，差额并入块 2）。⑥ **剩余（10:00-21:30）**：数学还需 **~134′**（累计 210′，含 10/16 补账 29′）/ 408 全 **180′** / 英语还需 **79′** / 政治 30′ → 已写进作战单「七、中检修正」。⑦ **当前最大风险＝午间段**：10/14 与 10/16 两次塌方都在 11:2x-13:53（`flags.bias_1014_midday`）→ **11:45 的 408 块是今天第一个考核点，12:45 起只吃饭、13:30 必须回桌**。"
  backlog_inflation_1017: "**用户 11:5x 指正（原话要点：『我从来没说要学这个，你莫名其妙给我挂账十几天』）→ 立为账目规则。** ① **事故链（逐环都是我加的语义）**：`baseline.cn408`（9/30 用户逐科实测回填，含**组原网课目录截图**）→ 我写 `remaining: 组原：第2章数据表示、第4章cache、第5章指令系统、第7章总线、第8章I/O`（**事实：未学章节清单**）→ W2 目标（10/5）写成『组原补漏起手 = 第 2 章数据表示』（**变成任务**）→ 10/6 起改称『挂账』（**变成欠账**）→ W3 / M3（10/14 重排）标『必保』（**变成硬承诺**）→ 连续 11 天在作战单 / 看板 / 中检回复里复述。**用户从未要求学组原。** ② **作废声明**：『组原第 2 章挂账 11 天』整条**作废**；W2/W3/M3/M4 正文同类表述标注作废（正文待 10/18 晚复盘统一改写）；今日作战单旧排表两处已标『10/17 作废』。③ **常设规则（账目口径）**：`backlog`、『欠账』、『必保』三个词**只能用于（a）用户明确承诺的交付物 或（b）当次派单且他接受的任务**；从『未学 / 未做 / 目录反推』得来的一律只能叫『**未覆盖**』，**不进 backlog、不标必保、不进当日排表**。④ **408 本轮范围 = 数据结构 ∥ 计网**；**组原与 OS 不在本轮**，何时开由用户决定，agent 不得主动排、不得在回复里主动提。⑤ **待办**：今日晚复盘把 `backlog` 全表复核，凡『agent 自行派单』的项改标『未覆盖』。⑥ **同类风险自查**：当日回复中我已复述过『挂账 11 天』并据此排表 —— 属重复偏差，与 11:41 / 11:46 两次同源（**用推算结果替代用户指令**），一并计入重复偏差台账。"
  cs408_subjects_1017: "**用户 11:46 当面指正（原话要点：『408 90′ 组原第 2 章数据表示——也是疯魔了，我数据结构没学完，而且数据结构和计算机网络在并行学习，你突然加个机组不知道是什么意思』）→ 408 科目结构立规。** ① **认账两处**：**(a) 组原第 2 章不是我临时编的** —— `this_week_target_1014`（W3 目标）与 M3（10/14 重排）都写死『组原补漏起手 = 第 2 章数据表示，必保』；**(b) 但把它排进 10/17 是排表错误** —— 数据结构第 6 章 10/16 才收口、**第 7 章未开**、计网停在 **4.1 ✅（21 题错 3 = 85.7%）/ 4.2 未开**，**两科都没收口就开第三科**＝把『一轮』拆得更碎（`page_based_cost_1003` 已算出 408 一轮任何档位都不可达）。② **口径修正（即刻）**：**408 = 数据结构 ∥ 计网，只这两科**（与 `baseline.cn408.remaining` 原状一致）；今日 408 两块 = **13:30-15:00 数据结构 90′**（6.1 回炉 08、12 → 7.1 + 7.2）/ **18:55-20:25 计网 90′**（4.2 IPv4 首部格式 + 地址 + 分片重组，本节试题精选全做 + 记题号正确率）。③ **组原补漏撤出 W3 与 M3** → 回落 **M4 尾部（10/26-10/28）**；届时数据结构第 8 章未收口则按 `estimate_bands_1014` 溃退顺序**只做考点速览 + 选择、不推章**。④ **408 排表硬规则（常设）**：正在推进的科目 **≤2 科**；一科收口才可开下一科；**禁止为『补挂账』在并行两科未收口时插入第三科**。⑤ **待办**：M3 定义（`milestones.M3`）与 `this_week_target_1014` 正文里的『组原补漏起手』需在 10/18 晚复盘时同步改写（本条已生效，文档正文待改）。"
  schedule_clock_table_1017: "**用户 11:43 第二次指正（原话：『依旧是要求时间表，你给个块实际上纯偷懒而已』）→ 立规：排表必须给到分钟的完整钟点表。** ① **错误定性与 10/17 11:41 的不同**：11:41 那轮他批的是『把饭推到 12:45 + 建议无缝衔接』，我的回应是改成『块序列 + 只锁两个死点』—— **这是过度纠偏，等于把排表工作推回给用户**，被当场判为偷懒。**正确解 = 两份都要：钟点表给死（到分钟、含换通道、含饭点），同时把饭点写成他的真实习惯点**（午饭 11:45-12:15 起 / 晚饭 17:20-18:20 起），**不得用学习块结束时刻倒推饭点**。② **今日定稿钟点表（11:43 起）**：11:45-12:40 午饭 / 12:40-13:00 小睡≤20′（13:00 后不睡）/ 13:00-13:25 换通道 / 13:25 回桌坐定（R8 13:30 硬点）/ 13:30-15:00 408 90′（6.1 回炉 08、12 + 7.1/7.2）/ 15:00-15:15 换通道 / 15:15-16:15 英语 60′（Text 4 限时 22′ 15:15-15:37 + 精读 38′）/ 16:15-17:15 数学 60′（第 15、16 讲例题各 2 + 笔记 → 闭环）/ 17:15-17:25 换通道 / 17:25-18:10 晚饭 / 18:10-18:55 深恢复 45′（出门走）/ 18:55-20:25 408 90′（组原第 2 章）/ 20:25-20:55 政治 30′（史纲第 3 节）/ 20:55-21:20 收尾 / 21:20-21:30 缓冲 / **21:30 关屏 → 22:30 上床 → 23:00 合眼**。→ 合计 数学 191′ / 408 180′ / 英语 101′ / 政治 30′ / 深恢复 45′；**英语距 120′ 新政差 19′，如实记账不虚报**；英语生词 20′ 并入 10/18。③ **权重说明**：钟点表里 **408 两块 180′ 与数学 60′ 属保底线不动**，可砍项仅限英语生词与收尾；深恢复 45′（≥45 下限）不动。"
  schedule_meals_anchor_1017: "**用户 11:41 当面纠正第二次同类错误（原话要点：『你每次结束完就建议无缝衔接下一轮』＋『搞得好像我能点外卖到 12:45 吃饭一样，而且就算可以，我有什么理由去破坏自己按时吃饭的习惯？我都说了很多遍了』）→ 立为常设规则。** ① **饭是固定锚点，不是浮动块**：历史饭点起点 = 午饭 **11:21 / 11:45 / 11:52 / 12:08 / 12:15 / 12:34**（10/16 / 10/5 / 10/9 / 10/3 / 10/6 / 10/11 日志），晚饭 **17:1x-18:2x**；今日我排『408 到 12:45 → 午饭 12:45-13:30』**比其常规点晚 30-60′** → 等于要求用户推迟吃饭，且**违反他自己『按时吃饭』的习惯**（习惯本身不构成可牺牲项）。② **agent 不得用学习块结束时刻倒推饭点**；三餐**只给参考窗不给硬钟点**（午饭 11:30-12:30 / 晚饭 17:20-18:20）。③ **块间换通道是排表组成部分**：任何『下一步』必须显式写出换通道时长 + 动作，**禁止『立刻 / 无缝 / 直接转下一块』** —— 此为『无缝衔接』错误的第 2 次复现（10/16 作战单亦把整下午排成无间隙连排），**计入重复偏差**（承宪法第 17 条留痕口径）。④ **每天死点只有三个**：13:30 回桌 / 21:30 关屏 / 23:00 合眼；其余一律『结束时刻不锁定』。⑤ **与 `flags.scheduling_rule_1016`（浮动晚饭条款）的关系**：以本条为准 —— **饭不浮动，浮动的是学习块的结束时刻**；`scheduling_rule_1016` 中『晚饭只给开始时间不给结束时间』的写法**保留结论（不限制吃饭时长）、废弃其『块与块连排』的隐含排版**。⑥ **待办**：10/18 周结算时把本节与 `scheduling_rule_1016` 合并成正式条款 R14 写入 `state/规则清单.md`。"
  notes_1017_mid3: "**10/17 中检 #3（15:00:49 取时；素材＝iHour 概览第三张）**。① **新增记录**：13:42-15:00 **77′ 数学（例题补充；笔记补完）** → **今日 4h09m（数学 208′ / 英语 41′ / 408 0′）**。② **交付物判定：微积分三第 15、16 讲 = 闭环 ✅**（视频 55′ + 例题与笔记 77′，符合 `judgement_rule_1009` 的『视频 + 题』口径）→ **数学 208′ ≥ 180′ 保底达成，10/16 欠的 29′ 全额核销**（超 28′，余 1′）。③ **偏差（如实记，不追问成因）**：原排 13:30-15:00 = 数据结构 90′，实际做数学 → **408 今日到 15:00 仍为 0′**，这是今天唯一的硬缺口；块起点 13:42 晚 12′（R8 判定线内，不计违规）。④ **改表（只改表，不改变保底）**：英语 15:10-16:15 65′（Text 4 限时 22′ + 精读 43′）→ 16:30-17:20 数据结构 50′（6.1 回炉 08、12 + 7.1）→ 17:20 晚饭 → 18:05 深恢复 45′ → 18:50-20:20 计网 90′（4.2 IPv4）→ **20:20-20:50 数据结构 7.2 30′，政治今日并入 408**（宪法第 5 条：阶段1-2 政治可整段归零，P0 不让位）→ 20:50 收尾 → **21:30 关屏**。⑤ **保底算术（15:00 重算）**：数学 208′ ✅｜408 **170′（差 10′，明日记）**｜英语 106′（差 14′，明日记）｜政治 0。**今日不可能双 P0 全达保底 —— 数学已拿满并还清补账，408 的 10′ 缺口由明日第一块补，不从今天压。**"
  notes_1017_mid4: "**10/17 中检 #4（16:29:30 取时；素材＝iHour 10/17 片段截图 + 用户自贴的 Text 4 精读笔记全文）**。① **新增记录**：15:19-15:38 **18′ 英语做题（text4）** + 15:38-16:28 **50′ 英语精读（精读 text4 + 反思做题方法）** = **68′** → **英语今日 109′（41+68）**。② **交付物（按 `judgement_rule_1009` 认交付物不认口述）**：2011 Text 4 **精读笔记 + 核心词汇 19 条 + 五大题型速查表 + 三条做题习惯改造（论据≠论点 / 靶子≠作者结论 / 原词重合陷阱）** —— 这是**方法论级输出**，比单篇分数值钱，记 `english_deliver` 主项。③ **计分口径更正（用户 16:3x 当面指出）**：考研阅读每篇固定 **5 题**，**只报错题号即可计分，未提及即视为正确** → **本篇 2011 Text 4 = 3/5（错 37、38）**；**2011 四篇合计 13/20 = 65%**（T1 5/5 · T2 2/5 · T3 3/5 · T4 3/5）。我先写「缺一个数 / 总分未知」是**把可从错题号推出的结果当成数据缺失**，属多余追问，已立 `规则清单` **R17**：agent 不再索要总分。**不追问过程、不打断 16:30 的 408 块。**④ **方法论的可用性判定（督学侧）**：他自评『就算所有词都认识，我依旧很有可能答错这两题』→ 定位准确；给出的三条改造里，**『纯例子段提问 → 先找抽象概括项 + 强制瞄下一段首句』** 是可执行动作，直接固化进后续复盘口径；**『读题干不看选项』** 与 `no_time_limit_1013` 不冲突（不限时≠不看题干）。⑤ **英语新口径下的余额**：109′ vs 120′（`kpi.english_policy_1013`）→ **差 11′**，明日记。⑥ **下一块（17:55 晚饭 → 18:40 深恢复 → 19:25 起 408）**：见作战单。"
  notes_1017_mid5: "**10/17 中检 #5（17:53:09 取时；素材＝iHour 概览第四张 + 用户自述）**。① **数据**：16:38-17:51 **72′ 408（数据结构 7.1 + 7.2 视频学习完毕，做完并批改 12 题，(12/26) 未做完）** → 今日 **6h30m（数学 208′ / 英语 109′ / 408 72′）**。② **换通道实测 7′**（16:31-16:38，排表给 15′）→ 记偏差但不罚（用户选择，且比连排好）。③ **408 交付物口径**：视频两节 ✅ + 批改 12 题，「(12/26)」按**已做 12 题 / 本节 26 题**解读 → **正确率未报，晚复盘按题号区间补**（若为『对 12 题』则需同时给错题号，两种口径结论差 46% vs 未知，**不得先假定**）。④ **计网 4.2 放弃（用户自述『一看 IPv4 一小节的题目有 72 道，果断放弃，严重打击士气』）** → **这是本节设计问题，不是执行力问题**，处置写死为口径：**交付物 = 时间盒内的题号区间 + 正确率，不是『把 72 道做完』**；40′ 时间盒能走多少记多少，剩余标『未覆盖』（R14：未做 ≠ 欠账）。⑤ **士气项的正确动作（宪法第 15 条）**：不评价状态，只把今晚目标缩到最小可交付 —— 6.1 回炉 2 题 + 7.2 余 14 题时间盒 30′ + 计网 40′ 时间盒。⑥ **408 今日定格 162′**（72+20+30+40），距 180′ 差 **18′**，明日记。⑦ **17:56 用户改表**：『今天不考虑计网，这个时间段大概率是看两节高数课视频』→ **20:30-21:10 改为数学第 17、18 讲视频**，计网今日不排（不计欠账，标『未覆盖』）；数学今日预期 208+40 = **248′**。"
  triage_1017: "**用户 17:58 提出二轮取舍问题（原话）：『我到一轮结束阶段，真题和强化课之间百分之百需要有取舍，无论强化课还是真题都不可能全部看完，也不可能两边有哪一边完全不设工作量。这怎么办，时间太紧张了』→ 立为取舍口径（10/18 周结算正式并入 `plans/百日总作战计划.md`，用户一句话可改）。** ① **唯一裁决原则**：**强化课的入场券是错题，不是目录** —— 没有错题证据的章节，课不看；每个真题错题必须落一条『错题 → 对应课程段』映射，**下一周只买表里的段**。② **分阶段配额（强化课 : 真题）**：**一轮余量（10/18-10/28）8 : 2**（课把未覆盖章推完，真题每周只抽 1 套数一计入）；**二轮（10/29-11/22）4 : 6**（数学真题 2016-2021 六套、408 真题 2009-2016 八套分章；课的时长上限 = 该周真题/订正时长的 40%）；**三轮（11/23-12/18）1 : 9**（数学 2022-2025 四套 + 前述二刷错题、408 2017-2025 九套套卷；课只在错题处点播）。③ **科目例外（不适用上述比例）**：**英语 = 真题一枝独秀**（2011-2025 共 60 篇阅读，按每天 1 篇 ≈ 70h 排到 12/10），强化课 11/1 起每周上限 2h（作文/新题型/翻译）；**政治 = 1000 题 + 肖八肖四**为主轴，课只在错题处（真题价值低，不单列配额）。④ **配套硬规则**：真题**按套计时 3h 收卷**，订正时长另计且与做题 1:1；每套产出『错题 → 课程段』映射表一张，这是取舍的自动裁决器。⑤ **结论一句话**：两边都不全做，**课按错题买、真题按年份配额做**，比例随阶段从 8:2 走到 1:9，不需要在两者之间选一个彻底放弃。"
  replan_1017: "**用户 17:59 判断：『28 大概率一轮无法结束，这是基于 72 题计网还有诸多学科实际上非常繁重的任务量做出的判断』→ 触发宪法第 7 条（偏差 >20%）+ 协议 G（只砍范围不砍时长）。agent 复核算术，结论：用户判断成立，10/28 本来就不可能「学完」。** ① **数学算术**：微积分三剩 20 节（第 17-36）× 60′ ≈ **20h** + 线代 6 章 ≈ 25h + 概率 8 章 ≈ 30h = **≈75h**；到 10/28 只剩 11 天 × 3h = **33h** → **缺口 ≈42h**。② **408 算术**：数据结构第 7-8 章 ≈ 5 天 + 计网 4.2-4.x 余量 ≈ 3 天 + 组原 5 块 ≈ 4 天 + OS 5 章 ≈ 7 天 = **≈19 天**；可用 11 天 → **缺口 ≈8 天**（且今日 7.1/7.2 一节 26 题只做完 12 题，实测速率比 3′/题更慢）。③ **裁定：10/28 不再是「一轮结束日」，是「切点」**（承 `replan_1014` ③ 已有口径，本次把它写进 M4 正文）：**数学只做微积分收尾**、**408 只做数据结构第 6-8 章收口**；**线代 / 概率 / 组原 / OS / 计网余量全部移出，转二轮首段（10/29-11/22）**。④ **二轮形态随之改写**：不再『看完课再做真题』，改为 **真题先行 → 错题 → 只回看对应课程段**（与 `triage_1017` 同一裁决器）；组原/OS 进二轮第一周，避免 11 月才发现 105 分没动。⑤ **代价与风险如实写**：微积分以外的数学（线代 6 章 + 概率 8 章 = 14 章）与 408 的 OS/组原 将全部压在 10/29-11/22 这 25 天内 —— 这 25 天会是最重的一段，**若 11/8 时线代+概率未过半 → 触发第三次重排（砍概率后 4 章细节、OS 只做真题章节）**。⑥ **今日不受影响**：10/17 的块序不改（19:25 起 408 三块 + 20:30 数学两讲视频）。"
  notes_1017_mid6: "**10/17 中检 #6（20:11:41 取时；素材＝iHour 概览 + 王道数据结构 p270-272 拍照 + 用户自贴折半判定树笔记）**。① **数据**：19:34-20:10 **35′ 408（数据结构 7.2 做完、批改完、整理完）**，**26 题全对（26/26 = 100%）** → 今日 **7h04m（数学 208′ / 英语 109′ / 408 107′）**。② **交付物判定：第 7 章 7.1 + 7.2 🟢 高质量闭环**（视频两节 + 26 题全对 + 折半判定树形态结论成文）→ **数据结构第 7 章过半**。拍照范围 p270-272 覆盖 7.2.4 本节试题精选 01-26（含 2010/2015/2016/2017/2023/2024/2025 真题嵌入题）。③ **用户自贴的技术结论（按红线只记留痕、不判对错）**：『子表元素个数为偶时，mid 向下取整 → 右子树比左子树多 1；向上取整 → 反过来；同一棵树里两种差异同时出现则非法』—— **该结论可直接用于 2017 真题那类『判定树形态』题，记为可复用结论**（`mistakes` 仅在出错时追加，本条不计错题）。④ **6.1 回炉 08、12 第 3 次未做**（原排 19:25-19:45，实际 19:34 起做的 7.2）→ **不再往今晚加**，**移入 10/18 块 1（裸启动块，做题形态正好匹配）**。⑤ **408 今日定格 107′**，低于 180′ 保底 73′，且 **10/16 = 178′（差 2′）+ 10/17 = 107′ → 连续 2 天未达保底** → 按宪法第 8 条 **10/18 起进降级模式**（政治归零、英语压到 1 篇阅读、其余并入数学与 408），与 `规则清单` 4.2 第三档（10/19-10/25）**同向不冲突**。**【10/18 09:2x 复核改判 —— 用户质询「178 分钟和 180 分钟的区别是什么」】10/16 的 178′ 按宪法第 5 条新增容差（≥175′ 视为达成）改判达标 → 「连续 2 天未达」不成立 → 宪法第 8 条不触发；10/18 降级只由 4.2 第三档支撑（该条独立成立）。**⑥ **今晚剩余（20:11 起）**：20:15-20:25 换通道 → 20:25-21:10 数学第 17、18 讲视频 → 21:10-21:25 收尾日志 → **21:30 关屏 / 23:00 合眼**。"
  travel_1017: "**用户 21:33 提出：『感觉得最后一周回深圳了，因为电脑不方便带回去，然后我现在很多学习任务还是有电脑才更加方便』→ 裁定与截止日如下。** ① **回深圳日 = 2026-12-13（周日）到位**，12/14 起按考场作息（含 06:30 起床 + 下午 14:00-17:00 全真套卷时段对齐初试时间）。② **关键判断：这不是「最后一周」的问题，是「12/12 前必须把依赖电脑的任务清空」的问题** —— 三轮（11/23-12/18）主体是**套卷 + 背诵 + 错题回看**，本来就不该再依赖网课；因此**所有剩余强化课/视频课必须在 12/12 前刷完**，12/12 打包只带纸质件。③ **纸质包清单（12/12 前备齐）**：数学真题 2022-2025 四套 + 错题本 + 公式卡；408 真题 2017-2025 九套 + 错题本；英语 2018-2025 真题 + 作文模板 + 词表；政治 肖四背诵版 + 1000 题错题。④ **无电脑演练**：**11/22（三轮启动日）用 iPad 跑完整一天**，把「必须电脑才能做的动作」在这一天暴露出来，不留到 12/13。⑤ **时间节点**：12/9 起准考证可下载 → **当天打印纸质版两份**（与电脑无关）；12/18 看考场；考试 12/19-20。"
  notes_1017_mid2: "**10/17 中检 #2（11:36:55 取时；素材＝iHour 概览第二张）**。① **新增记录**：10:40-11:36 = **55′ 数学（微积分三第 15、16 讲视频学习结束）** → **今日累计 2h53m（数学 131′ = 76′+55′ / 英语 41′）**。② **交付物判定：第 15、16 讲 = 视频过 ⏳ 未闭环** —— 用户报『视频学习结束』，**例题未做**；按 `judgement_rule_1009` 闭环口径（视频 + 笔记 或 视频 + 题）不计闭环，**闭环动作转今日 17:50-18:50 块**（第 15、16 讲各 2 道例题 + 笔记要点 → 闭环后这两讲才算 10/17 的交付）。③ **两处偏差如实记账**：**(a) 块起点晚 40′**（排表 10:00 → 实际 10:40）；**(b) 9:54-10:40 共 46′ 去向未报** —— 登记为缺口、**未追问**（宪法第 15 条：不追问不施压；也因这 46′ 大概率就是换通道/午饭前段）。④ **进度对照（11:36）**：累计 173′，排表到 11:25 应到 175′（数学 90+85）→ **总量基本持平（−2′）**，但结构是**英语多 41′ / 数学少 44′**；数学保底 180′ 还差 **49′**，含补账目标 210′ 还差 **79′**。⑤ **下一步已重排**：11:40-12:45 408 65′（6.1 回炉 08、12 + 7.1/7.2）→ 12:45-13:30 午饭 → **13:30 回桌 组原第 2 章**（今日第一个硬考核点，`bias_1014_midday` 的两次塌方都在这个窗口）。⑥ **保底算术（若后续不误点）**：数学 131′+60′=191′ ✅ ≥180（补账 29′ 中核销 11′，余 18′ 记 `backlog` B8 余额并入 10/18）；408 需从 0 拉到 180′（11:40/13:30/19:10 三块 = 65+90+30）；英语 41′+60′+20′=121′；政治 30′。"
  morning_1017: "**10/17 早启动（Day 20，D-63，W3 第 6 天）· 正常档（非 degraded、非补偿日）**。素材＝10/16 夜→10/17 晨睡眠截图 4 张（小米 S4），写单时刻 07:47。① **睡眠（详见 `sleep_log` 10/17 条）**：入睡 **23:50** / 醒 **06:53** / 主段 **7h03m** / 深睡 35%（2h29m）/ 浅睡 36%（2h31m）/ REM **29%（2h03m）** / 清醒 0 次 / 效率 100% / **评分 86**（高于 85% 同龄）/ 心率 61 / 血氧 96% / 呼吸 18 / 规律性 早 25′。② **两端同时收窄但仍双破**：合眼端破 **50′**（昨夜 123′ → 收窄 73′）；起床端 06:53 超判定线 ≤06:45 共 **8′** → **R1 双端破线 1 次**，本自然周累计 **3 次** → `规则清单` 4.2 **第三档**（次周 10/19-10/25：政治归零 + 英语压 1 篇阅读 + 全部时间并入数学与 408 + flags 事故留痕）。③ **时长侧连续第 3 天 ≥7.0 线但逐日下滑**（7h37m → 7h27m → 7h03m）→ 正在向 7.0 线收敛，**本夜唯一要拿的是合眼端 23:00（`rule_19` 立法以来 0 次命中）**。④ **三条强制降级全不触发**：宪法第 16 条（主段 7h03m > 4h、清醒 0 次）不触发；协议 B 第 0 条（近 3 夜 23:19 / 01:03 / 23:50，仅 1 天晚于 00:30；7h03m ≥ 6h）不触发；规则 18 补偿日条件成立（S = 8 / D = 7）**但不行使**（06:53 已自然醒）→ **今日正常档：数学 180′ + 408 180′ + 英语 120′ + 政治 30′**。⑤ **今日一级 KPI = 锚点**（R1 罚则③）；**启动块 = 裸启动**（承 10/16 罚则②，不许打开任何视频/课）。⑥ **作战单已写**（`state/今日作战单.md`）：数学 **210′**（180′ + 补 10/16 的 29′）/ 408 **180′**（6.1 回炉 08、12 + 第 7 章 7.1/7.2 + 组原第 2 章起手）/ 英语 **120′**（2011 Text 4 限时 22′ + 精读 + 不背单词 200）/ 政治 30′（史纲第 3 节）/ 深恢复 50′（16:20-17:10 出门走）。⑦ **W3 剩余两日重排已生效（只砍范围，不动时长）**：线代进度 0′ vs 计划（落后 100%）→ **M3 改写为「线代第 1 章行列式一轮 + 组原第 2 章数据表示起手」**，线代 2-6 章后移至 10/19-10/25；10/18 块 1 起手线代（不排在微积分之后）。⑧ **待用户一句话 4 项**（作战单第五节）：10/16 关屏/上床/合眼时刻 + 褪黑素；10/15 作战日资格口径；英语 120′ 是否落盘为正式配置；本周 R1 第三档是否照执行或申请豁免。"
  rule_exec_1017: "**R1 双端破线 1 次（10/17 判定，针对 10/16 夜→10/17 晨）+ 本自然周累计第 3 次 → `规则清单` 4.2 第三档**。**客观事实**：合眼端入睡 **23:50**，破 23:00 锚点 **50′**；起床端 **06:53**，破 06:30 锚点 **23′**、超判定线 ≤06:45 共 **8′**；**两端同破**。**同时记录的改善（处罚不掩盖事实，事实也不掩盖改善）**：破线幅度 **123′ → 50′（收窄 73′）**；主段 7h03m **连续第 3 天 ≥7.0 线**；REM 2h03m（+20′）；评分 86。**罚则执行（`规则清单` 4.1 + 4.2）**：① **次日（10/18）06:30 闹钟提前到 06:00** + 起床后 30′ 内出门走 15′；② **次日（10/18）启动块 = 裸启动**（不许看视频/课，只许做题或遮答案重做错题）；③ **当日（10/17）KPI 第一位改为「锚点」**，科目时长让位；④ **累积第三档（次周 10/19-10/25）**：政治归零 + 英语压到 1 篇阅读 + 全部时间并入数学与 408 + 写 flags 事故留痕。**性质说明**：本夜是记录期**幅度最小的一次双破**，第三档针对的是**频率（本周 3 次）**而非单夜严重度 —— 判据写在 `规则清单` 4.2，agent 不擅自放宽（放宽须用户明确说下调）；若用户要豁免，按第六节**须事先提出并经本人确认**。**未执行项如实记账**：10/16 罚则①（06:00 闹钟）未执行、不追溯、不叠加；10/15 作战日资格口径仍待用户一句话裁定（影响 `rule_18` 链条，现按宽松口径落盘）。"
  notes_1019_session_recovery: "**10/19 数据由会话存档恢复（10/20 06:0x）**。用户指出『10/19 的 session 漏写文件』→ 从 `C:\\Users\\asus\\.dsh\\sessions\\--D-deepseek_dsh--\\session-efa9fbe2-c9bc-4c41-97ee-26c19d780e17\\session.v3.jsonl.zstd`（1,087,040 字节，末次写入 10/18 08:11）解压 3.7 MB jsonl，按 `time` 抽取 → `logs/2026-10-19.md` 已按实际重写。**实际 4h55m**：数学 218′（10:44-11:42 57′ 第 22/23 讲笔记补全；15:19-15:27 7′ 点火公式；16:33-17:59 85′ 第 24/25 讲视频 + 24 讲笔记例题；19:13-19:26 12′ 25 讲笔记例题；19:32-20:29 57′ 第 26/27 讲视频）、408 26′（20:59-21:25 例题 2.1 共 1 题正确）、英语 51′（15:27-16:19 大纲词汇 200 词 + 复习 28 词）、政治 0；午睡 12:34-13:59 = 1h25m。**判定**：数学 218′ ✓ / 408 26′ ✗（差 154′）/ 英语 51′ ✓ 但**真题阅读 0 篇** → **14 天里第一个『唯一全达标的是数学』的日子**；10/19 属恢复日（14:00 前不排学习）却 10:44 即开工 57′ → 按 `规则清单` 4.2 第四档『违反一次 → 第二天生效』计数 1 次。**待办遗留**：微积分三已 22→**27 讲**（6 讲），剩 **28-36 讲（9 讲）**；用户 20:33 自报『数学最晚 21 号结束微积分一轮』。"
  notes_1020_early: "**10/20 早启动（Day 22，D-60）· 睡眠不足夜 + REM 惊醒**。素材＝10/20 睡眠截图（小米 S4）。**主段 5h13m（23:20-04:33）/ 深 34% / 浅 43% / REM 23% / 清醒 0 次 / 效率 100%**。**判定**：① 主段 >4h 且夜醒 0 次 → **宪法第 16 条不触发**，今日 `degraded` 不启用，走正常档；② 主段 <7.0 → 记**睡眠不足日**（规则 18 的 D 计数 +1，新链 10/9 起算）；③ 合眼 23:20 破 20′ → R1 本周第 6 次；④ **结构端恢复充足（深睡 1h46m / 效率 100%）→ 不回笼的判据成立**。**缺口**：英语真题阅读连续 2 天零（2012 Text 1 欠 2 天）；408 昨天仅 26′。**今日一级 KPI**：三锚点（21:30 关屏 / 22:30 上床 / 23:00 合眼）+ 微积分三第 **28-31 讲**（昨日已到 27 讲，10/21 收口 36 讲）。"
  zero_output_1021: "**10/21 = 0 产出日（用户 20:55 自报『今天行动为 0』）→ 已落盘 `logs/2026-10-21.md`（hours=0.0，四科全 0）。** **0 产出日台账（全记录期，共 3 天）**：① **2026-09-28（周一，葬礼）** —— 外部不可抗力，degraded，消耗 9.5h 缓冲，不计欠账；② **2026-10-08（周四，补偿日）** —— 主动全天休（`all_day_off`），当日 03:30 入睡 / 08:45 醒 / 午睡 51m / 学习 0；③ **2026-10-21（周三，今日）** —— **唯一一个非外部原因、非计划安排的 0 产出日**。**间隔：9/28 → 10/8 = 10 天；10/8 → 10/21 = 13 天** → **0 产出的自然周期量级 = 10-13 天**。**休息日参考结论（用户 20:55 指定的用途）**：10/9-10/20 连撑 12 个作战日后于今日归零 → **主动休息日的节奏应 ≤10 天一次**，否则等身体替你排。**据此下次主动休息日 = 2026-10-29（周四）** —— ① 距 10/21 = 8 天，落在 10 天周期内；② 恰为 P1 硬截止（10/28）与 M4 收官次日，阶段切换点，砍一天不伤主线；③ 与宪法第 18 条新链条 S=7 的最早触发日重合。**口径限制**：9/28（外部）与 10/8（主动）性质不同，『10-13 天』只由 10/21 一个样本可用反推，**不作硬规则**；若 10/22-10/28 出现第 4 次 0 产出 → 周期判据作废、重算。"
  rest_day_rule_1021: "**R19 强制休息日（10/21 20:5x 用户裁定三参数）** —— 频率 **11 天强制执行**（不得延后，可提前但不得早于第 8 天）；形态 **半天**（上半日 = 12:00 前不排学习块 / 下半日 = 13:30-17:30 不排学习块，**当天早上自选**）；「**必须是完全坦然接受休息状态**」→ 休整日 agent 不得提倒计时/余额/欠账、不得建议「顺手做点」、不得问「要不要学一点」。**记账**：日志 `rest_day=planned`，**不计断链、不触发宪法第 8 条、不算未达保底、不进 backlog**（与 `zero_output` 严格区分）。**执行方式**：作战单首行写「距强制休整日：N 天」。**当前排期**：起点 10/21（被动归零已歇）→ **上限 11/1（周日）**，可提前窗口 10/29-11/1，**建议 10/29-10/30**（11 天连续卡在实测 12 作战日崩线，只留 1 天余量）。**与宪法第 18 条补偿日的分工**：补偿日 = 睡眠债触发（S≥7 且 D≥3）；R19 = 连续作战时长触发；同日只消耗一次，按 R19 执行、补偿日权益保留。全文见 `kaoyan/state/规则清单.md` 第八节。"
  fatigue_model_1021: "**疲劳侦测模型（10/21 用户要求建立；预兆机制由用户自述提供）** —— 用户原话：『我一直避开408的做题和学习时间，原因有二，表面上是IPv4太庞杂了、我有畏难心理，但实际上也是我厌学和需要休息的潜意识被我完全压抑住了，直到今天才爆发』。**核心结构：畏难感 = 耗尽的最低成本出口，不是能力判断。** 系统被压到极限时，先放弃「阻力最大 + 最需主动建构」的那一科（对用户 = 408 的做题），同时保留低阻力动作（看视频、数学例题收尾）→ 所以**总时长可能正常甚至超量，缺口只出现在「做题」这个动作上**。**五信号（全部可由日志 / iHour / 对话算出）**：**S1 科目回避 +3** —— 某科连续 2 天低于保底线 60%（408 <105′）且同期其他科正常或超量；**S2 措辞投降 +2** —— 出现「放弃 / 太庞杂 / 做不完 / 果断跳过 / 打击士气」，**一次即计分、不需连续**；**S3 块长碎片化 +2** —— 当日中位块长 <45′；**S4 时相后移 +2** —— 合眼 7 日均值 >23:45，或连续 3 晚逐晚更晚；**S5 启动延迟 +1** —— 首个学习块晚于排表 >45′ 且连续 2 天。**判定**：0-2 正常 / 3-4 黄灯（当日砍 1 块、深恢复升到 60′）/ 5-6 橙灯（在 R19 窗口内提前休）/ ≥7 红灯（当日 degraded 档 + 48h 内强制一天 R19 休整）。**计算时机**：每天晚复盘落盘时算一次，写进日志 `fatigue_score=N` —— 不额外轮询（承宪法第 20 条）。**回测**：10/17 晚 S1 未触发（408 仅 1 天 <105′，107′）、S2=1（IPv4「果断放弃」）→ 2 分，单看不够；但叠加 S4（合眼连续后移）与 10/18 的 S5 → **10/18 本应到 5 分橙灯**，而 10/18 恰是 R19 口径的「第 8 天」→ **若 10/18 休半天，10/19-10/21 三连崩可避免**。**今天（10/21）回测 = 7 分红灯**：S1（10/19 26′ + 10/20 86′ 均 <105′，同期数学 218′ / 236′ 正常）= 3、S2 = 2、S4（10/19 23:21 → 10/20 23:20 → 10/21 00:16）= 2。**教训（承 10/17 事故）**：10/17 我把「IPv4 72 题果断放弃」判为「本节设计问题」并给了时间盒 —— 方向偏了，那是**耗尽的最早出口**，正确处置是当天减量 + 备休，而不是换时间盒口径。"
