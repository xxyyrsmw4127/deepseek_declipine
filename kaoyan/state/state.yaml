recovery_protocol:             # 10/1 起执行：宪法第 13 条（休息＝换通道）+ 用户 9/30 提供的「恢复性 vs 生产性阅读」判据
  daily_deep_recovery: "每天一次 60-90 min，两块可连成一个块：① 出门走路 + 听歌 25-30 min（**身体参与，硬性**）② 纸质小说 30-45 min（叙事/情感通道）"
  bedtime_reading_slot: "21:30 关屏后 → 22:15 纸质小说（填掉『关屏后干等到 22:30』的真空 —— 今天那段真空就是用手机填的）；同时是降压手段，帮入睡"
  restorative_reading_rules: ["不设进度", "不做笔记", "不查生词", "读不下去就扔"]
  book_ranking:
    first: "《约翰·克利斯朵夫》—— 叙事驱动、情感为主、随时可停 = 唯一稳的恢复性读物（四册量足够覆盖到考试，不赶）"
    conditional: "《史记》本纪 / 列传（项羽、刺客、淮阴侯）接近故事，可当休息；八书十表是专门史，属于啃"
    not_rest: "儒家四书（《孟子》长篇论辩、《大学》《中庸》抽象结构化 = 生产性阅读；《论语》语录体可随手翻）、无裴注《三国志》极干"
    placement: "四书 / 史记 / 三国志 放在『真心想读』时读，不放在『需要休息』时读；兴趣本身是恢复力，但要用判据试两次再定"
    language_note: "文言是解码劳动：白天数学 + 408 + 英语已占满语言/逻辑/工作记忆通道，睡前文言 = 同一通道继续加压"
  channel_judge: "休息完回桌前，第一道题进入状态 ≤2 min → 有效；磨蹭半天进不去 → 那段休息是假的（无论多长）"
  anti_kpi: "禁止把休息阅读变成 KPI：不设卷数、不打卡、不补进度；纠结『这段没读懂』= 通道已切回语言逻辑，休息当场结束"
  skin_care_boundary:             # 10/2 新增，机制经用户实测修正
    mechanism: "护肤品不影响中枢（原判断成立但不是结论）。真实机制在**皮肤上的触觉残留**：用户原话『涂完之后脸上油乎乎的一直都能感受到，我夜起后没直接继续睡也是这个原因，因为我想先洗掉脸上的东西』。黏腻/成膜感是一个持续存在的**本体感觉输入**，后半夜（睡眠维持期）对体感刺激最敏感 → 02:56 醒来后不是睡不着，是**多了一个优先级更高的动作**（洗掉），2h19m 清醒由此被行为坐实。"
    judge: "**若醒来第一反应是『我要先洗掉脸上的东西』，那是护肤时间表问题 —— 不是生物钟问题，更不是意志力问题。** 不许把它记成『我又没控制住』。"
    rules:
      - "① 涂酸＝晚餐后第一件事（约 20:00-20:30，或洗完澡立刻）；保湿＝21:35 关屏后顺手做。**两件事都不许出现在上床前 30 分钟内**"
      - "② 顺序与等待：涂酸 → 等 15 min → 上珂润（神经酰胺型，成膜、比酸类干爽）。涂完到上床至少留 **90 min 干燥窗**"
      - "③ 产品放浴室柜，不放床头；21:30 后不开购物 App（含『再买一单』/比价）—— 10/2 09:56 那瓶 20% 壬二酸就下在这个窗口里"
      - "④ 备选阶梯（按成本从低到高，一次只动一级）：干燥窗不足 → 提前涂酸时间；仍黏 → 酸改到**早间窗口**、夜间只留珂润；仍夜起 → 酸改**隔日**"
      - "⑤ 夜间醒来即协议：**醒来 → 直接去卫生间清水冲脸 → 按干 → 回床**，照做即结束，不判断不纠结；冲脸不带手机、不看时间、不算还能睡几小时。23:00 后护肤动作一律不做（洗掉旧的可以，加新的不行）；冲完 20 min 仍清醒 → 暗光 + 纸质小说，不硬躺、不自责"
      - "⑥ 待验证数据（缺口）：**10/2 前夜涂酸与涂保湿分别几点？** 醒来时是『单纯黏』还是『刺痛/紧绷』（后者是配方不耐受，不是时间问题，直接走 ④ 的早间方案）"
    shower_timing:                 # 10/2 用户提出「洗完澡涂酸、睡前黏了直接洗脸」，据此定稿
      principle: "**洗澡时间就是整条链的第一个闸门** —— 洗澡点决定涂酸点，涂酸点决定睡前脸的干爽度，睡前干爽度决定夜里会不会再起床洗脸。**洗澡拖晚 ≠ 少睡一点，而是整条链断掉。**"
      benefit_double: "洗澡同时是**助眠手段**：热水澡后体温回落，回落发生在洗完约 1-1.5 h，正好是入睡窗口；睡前 15 min 内洗澡反而让体温来不及降。所以『早洗』既护肤也对睡眠。"
      order: "洗澡后**立刻**涂酸（皮肤微湿、屏障打开，吸收最好）→ 睡前只做 **1 步保湿**（珂润）。**把酸和保湿拆成两次，是这次分工的核心**：酸早涂换取更长的有效作用时间（≥2.5 h，远超说明书 15 min），保湿晚涂换取睡前干爽。"
      pattern: "晚饭 → （1 h 消化）→ 洗澡 → **立刻涂酸** → 块 3 学习 → 21:35 关屏后涂珂润（顺手，不单独成事）→ 22:30 上床"
      hard_rule: "**最晚 20:30 洗完澡**。晚于 20:30 → 酸仍照涂（宁可作用时间短），但**保湿必须减量到薄薄一层**，否则复现 10/2 的黏腻夜起。"
      after_dinner_gap: "**饭后到洗澡的间隔：标准 45-60 min；饭后犯困时允许压到 30 min（下限，不再更早）**（10/2 用户 18:2x 犯困时定）。理由：饱食后立刻热水澡会让血液从消化道转向体表、加重困倦；但硬等一小时导致趴在桌上睡过去，代价更大。压到 30 min 时：**只冲淋不泡、控温偏凉、≤15 min**，洗完**擦干立刻涂酸**，然后**出门走 10-15 min**（体温回落 + 走动 = 今天最后一个清醒窗口，用来做晚间那块）。"
      judge_flow: "若 23:00 后仍觉黏 → 先查**保湿是否涂多/涂太晚**（这是第一嫌疑），不要先怀疑酸；确认是酸的问题 → 走 ④ 的隔日/早间方案。"
      wipe_off_rule: "**睡前黏 → 清水洗脸是合法处置，不是失败**（酸已作用 2.5 h 以上，洗掉不损失什么）。但改用『洗澡后涂酸 + 睡前薄保湿』之后，**正常情况下不该再需要这一步**；若连续两天仍需要 → 说明保湿配方不对，换更清爽的。"

  body_care_boundary_1014:       # 10/14 新增：把 skin_care_boundary 从「护肤专属」升级为通则
    trigger: "**10/13 夜 → 10/14 晨：主段 3h25m（00:38-04:03）+ 夜间清醒 2h08m + 第二段 2h19m。** 用户 10/14 10:2x 自述成因：『操作不当导致肥皂洗私处的时候破坏黏膜系统，总之半夜被刺痛醒了』"
    evidence_comparison: "**与 10/2 夜构成同机制对照，主段时长完全相同**：10/2 夜（面部 壬二酸+珂润 黏腻）主段 **3h25m** + 清醒 **2h19m** + 第二段 4h14m；10/13 夜（黏膜 肥皂 刺痛）主段 **3h25m** + 清醒 **2h08m** + 第二段 2h19m。**暴露源不同、机制相同** → 10/2 把它记成『护肤时间表问题』是**范围划窄了**。"
    mechanism: "**外用化学品 → 持续本体感觉输入 → 在睡眠周期交界处（本记录期实测点 ≈ 入睡后 3h25m）醒来 → 醒来第一反应是「先弄掉它」→ 2 小时以上的清醒。** 与 `skin_care_boundary.mechanism` 同源，只是暴露部位由面部扩到黏膜。"
    rules:
      - "① **黏膜（私处）只用清水** —— 任何时候不加皂 / 沐浴露 / 洗液（黏膜无角质层，皂基直接破坏屏障 → 刺痛）。用户自提的解法正确，照此执行。"
      - "② **面部洗护与身体洗护不许互相串用**（酸 + 珂润是**面部专用**方案，不是『皮肤』通用方案）。"
      - "③ **夜间醒来即协议（扩展版）**：醒来 → 直接去卫生间**清水冲净** → 按干 → 回床；**不带手机、不看时间、不算还能睡几小时**。照做即结束，不判断不纠结。23:00 后只许『洗掉旧的』，不许『加新的』。"
      - "④ **判据**：醒来第一反应若是『我要先弄掉身上的东西』→ 判为**化学品 / 时间表问题**，不记生物钟账、不记意志力账。"
    takeaway: "**通则：任何涂 / 洗在身上的东西都是睡眠维持的一级变量，不是生活细节。** 与护肤同等对待 —— 上床前 30 分钟不做新的外用动作，且留足干燥 / 中和窗口。"

timebox_model:                 # 时间模型（9/30 定案）：用餐时间由家人决定、不可控 → 块驱动，钟点浮动
  mode_override_1003: "**10/3 用户明确否决块驱动输出**（原话『别给块了，没什么鸟用』；同时要求『充分考虑我的午饭时间和晚饭时间，之前给过提醒』）→ **此后作战单一律输出逐条钟点表**，每段写「时间 / 做什么 / 验收」，**且必须含午饭与晚饭的具体时段**（默认 12:30 / 18:20，取自 10/1『12:28 仍未开饭』与 10/2『约 18:20 起』的实测）。块长降为**内部分摊估算单位**，不再作为对用户的输出形态。**同类偏差已第三次**：10/1、10/2 各排过一版装不下午饭的密表（均由用户指出），10/3 早版又给了 90 分钟块序（用户第三次指出）→ 此后不再犯。"
  mode_override_1003_b: "**10/3 用户第二次收窄我的越界**（原话『有例题的。例题无需你提醒了，我会安排的，我已经有办法了』）→ 继 10/2『别给我出题了』之后，边界再外推一层：**不仅不出题，也不提醒/布置具体题目与例题**。数学与 408 的**内容推进方式由用户自行安排**，我只负责：时间段落、时长、外部材料的位次（如错题回炉清单在哪）、以及验收时需要他报什么（用时 + 推进内容 + 正确率）。**回归宪法第 9 条的可验收口径，但不再替他决定「做什么题」。**"
  unit: "90-100 min 块（仅供内部估算；对用户输出形态见 mode_override_1003）"
  rule: "块序固定、钟点浮动；任何打断 >25 min 记为块间休息，下一块重新计时 90 min；块内不接任何 5 分钟动作"
  anchors_fixed: ["06:30 起床＝离床（10/8 锁死，替换原 07:00）", "07:30-08:00 政治窗口（起床提前 30′ 后窗口可整体前移，排表时再定）", "21:30 关屏", "22:30 上床", "23:00 合眼（硬上限，10/8 锁死）"]
  overflow_policy: "块序走不完 → 按 数学 > 408 > 英语 优先级砍（当日块4/块5 为缓冲）"
  handwriting_policy: "**手写照片 = 工作量留痕，不是判卷请求**（10/2 用户两轮澄清后定稿，已入宪法第 6 条红线）：① 用户发手写笔记照片，默认意图是**留下『这段时间有实物产出』的证据**，用于落盘与进度累加；**不是**让我核对内容、也不是让我找错。② 正确动作：**记交付物（做了什么 / 几页 / 用时）→ 落盘 → 往前推进**；**不主动判对错、不追问公式细节、不出核对题**。③ 需要验掌握程度时走宪法第 6 条抽查（遮答案重做或口述方法，≤5 min），**只在晚复盘或用户主动说『抽查我』时进行**。④ OCR 对连笔/角标/平方号不可靠 → **仍然禁止作为判卷依据**，但这不构成『不能看图』：图是留痕用的，看它、记它、继续。⑤ 两次偏差留痕：先据照片判对错（用户指出识别不可靠）→ 又反向规定『禁止读手写』（用户指出用途只是留痕）→ **以本条为最终口径**。"
  note_method: "**新内容与复习内容的方法不能混用**（10/2 用户纠正，我此前把复习用的『默写』用在了新内容上，属于方法错配）：① **首次接触的新节**（如高数第八章、数据结构新章）= **对照讲义手动推导一遍 → 合书复现关键步骤 → 只把推不出来的地方记为回炉点**。第一遍就该看讲义，不必也不该裸默写；② **隔天/隔周的复习**才用『空白纸默写 → 再对照补漏』；③ 任何笔记的**合法内容**：公式 + 适用条件 + 1-2 处关键推导步骤 + 判据，**不抄视频画面、不逐句誊抄**；④ 笔记时长的**实测系数 ≈ 视频时长的 0.4-0.6 倍**（10/1 实证：20 min 的笔记计划实际花 47 min）→ 排表时按 1.2 倍预留，不再按 1 倍估。"
  chore_rule: "**家务只许在块边界做，块内零家务、零零碎动作**（10/2 定稿，经用户纠正一次）。⚠️ 首版写成『家务必须绑成一次动作』是**错的** —— 洗衣机有固定运行周期，『放进机器』与『取出来晾』在时间上必然分开，绑不成一次；把『减少分段』当目标属于搞错对象。正确对象是**分段落点**：① 有时间等待的家务（洗衣/收衣/解冻）**天然分两段，允许**，但**每一段只许发生在块边界**，单段 ≤5 min；② 把等待期当作**免费计时器**用：块1 开始前放进去 → 块1 结束（90'）正好洗完 → 边界处晾上。③ 无等待期的家务（洗碗/拖地/取快递）并入块边界或晚间深恢复时段。④ **块内出现的任何一件家务，无论多短，都记入当日时间损失账**。成因参照：9/30 那 217 min 不是家务造成的，是『手机在手上 + 下一个动作不明确』的真空造成的 —— 不要把账算错到家务头上。"
  schedule_floor: "**排表必须留出午饭与晚饭两块**（10/2 新增，二次犯错记录）：宪法 `timebox_model` 原文已写明「用餐时间由家人决定、不可控 → 块序固定、钟点浮动」，但 10/1 与 10/2 我各排过一版密到没有午饭位置的逐条钟点表（10/1 由用户指出，10/2 再次由用户指出）。**规则：块驱动版只写块序与时长，不写满钟点；每小时吃饭窗口按 40-50 min 预留；任何排表若装不下午/晚饭，即为无效排表。**"
  time_accounting_1006: "**时间账口径修正（10/6 用户当场纠正，此前两次偏差留痕）**。用户原话：『**刚刚去上大号了，而且吃饭时间不是我能控制的，欠不欠账不是这么算的**』。**修正后的三分类**：① **不记账（根本不计入）**＝生理需求（上大号/小号/洗澡/洗漱等维持性动作）＋**家人决定的用餐时长**（午饭/晚饭吃多久）＋任何**用户无法自决起止时刻**的外部占用（家人叫吃饭、被叫去做事）→ **只记『回桌时刻』，不记『花了多久』，不进时间损失账、不进可回收清单**；② **记账（损失 / 可回收）**＝用户**可以自决而没有自决**的时间：赖床、醒后在床上刷手机/论坛、无内容空档（任务间隙＋屏幕在手）、信息流泄漏、**与非督学 AI 的长对话**（如 10/6 07:33-08:35 的梦境讨论 60'）；③ **换通道（合法，不计损失）**＝走路/拉伸/真人说话/纸质小说等宪法第 13 条定义的休息，只记时长不记损失。**判据：时间账里每一项都必须能指认『他当时可以选别的』。指认不出来 → 不记。** **两次偏差**：10/5 作战单把『午间段 157′ 比 10/4 多 52′』列为『两大可回收项之一』，并把『午饭＋午休＋过渡』整段打包成可压缩对象 → **错在把家人控制的用餐时长算到用户账上**；10/6 早间账把『起身/洗漱/早餐 18′』与梦境讨论 60′ 并列成『损耗项』→ **错在把维持性动作当成损失**。**自此以后：排表仍留午饭与晚饭两块（`schedule_floor`），但不再对这两块的时长做任何评价或压缩建议。**"
  evidence: "9/30 午饭由家人决定，到 12:28 仍未开饭 → 原逐条钟点表整段失效；改为块驱动后块长不受饭点影响"

